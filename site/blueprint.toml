label = "Conjecture 4.10"
paper = ["arxiv-pairing"]
strengthen = """
**Where the arXiv pairing argument fails** (§4.6 of the note). Moving both halves of a pairing to
$C^\\star$ costs $2c_{C^\\star}$, which can exceed $c_i + c_j$, so "each city in $\\phi_0$ appears in
$\\phi$" does not give a lower cost; and per-pattern durations ignore the synchronisation of the new
pairs. Without (A1) the front is still certified wherever the bracket $L \\le C^\\star \\le E$ closes.
"""

[[section]]
id = "greedy"
title = "Why the papers' greedy is not exact"
intro = """
Both papers schedule each fixed multiset of landings (a PPP) greedily and claim the result is the
optimal makespan of that PPP. Their own words are in the grey boxes; §5 of the note gives the
counterexamples, and the smallest one is checked by the Lean kernel.
"""

[[node]]
section = "greedy"
label = "§5"
title = "The greedy counterexample"
leaves = ["ZenoFront.Examples.lptCounterexample_front"]
paper = ["evocop-algorithm1", "evocop-optimality"]
note_status = "P"
covers = "`lptCounterexample_front` is the exact front of `d = (6, 10)`, `c = (40, 20)`, `t = 5`, `p = 2`, for every table of central flights, checked by `decide +kernel` (no compiled code is trusted). It contains `(260, 60)`. That the 2016 greedy misses this point is the hand computation of the note (52/68 instead of 60/60) and the recorded output of the 2016 solver; it is not a Lean statement."
strengthen = """
**What fails.** "The above algorithm gives the optimal distribution of the set of times into $p$" is
false: longest-first onto the least-loaded plane is a heuristic (LPT), not an exact partition, and the
landings of a PPP must in addition be split so that the partition is *admissible*. Deciding whether a
multiset of landings can be flown within a makespan is strongly NP-complete (Theorem 8.1), so no
polynomial per-PPP rule can be exact unless P = NP. The no-waiting construction itself is correct
(Theorem 4.1).
"""

