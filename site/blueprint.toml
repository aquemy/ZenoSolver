# Blueprint node registry: the map from the theory note (revision 3) to the site's blueprint.
#
# One node per numbered result of doc/theory/exact-front.md, under its label, in the sections of
# revision 3, plus the unnumbered Notation paragraph. Everything else is derived at build time by
# site/gen_blueprint.py:
#   * the statement, the note's *Lean:* paragraph, the proof and the remarks are cut out of the note
#     by `label`;
#   * the claim is the entry of ../claims.toml with this `label` (and no `removed`); its effective
#     status gives the badge: machine-checked only if the ledger says so, and then its `lean`
#     declarations must be axiom-clean (`collectAxioms`). Every numbered result must have a claim;
#   * the Lean listings come from the source, located by asking Lean for each declaration's range.
#
# Fields of a node:
#   section   the id of its [[section]].
#   label     the note's label ("Theorem 4.5"), unique; the `node` shortcode links by it.
#   kind      "notation" for the Notation paragraph (no claim: badged "Lean definition" from the
#             kernel when its `lean` definitions are axiom-clean); omitted otherwise.
#   lean      the declarations the note's *Lean:* paragraph names. The ledger's `lean` is listed as
#             the node's Lean; these, with the ledger's `lean_partial`, as further declarations.
#   title     optional heading override.
#   covers    optional sentence for the Lean details, after the note's *Lean:* paragraph.
#
# [[main]] lists the main results shown at the top of the page, in order: `label` (a node), `name`,
# a one-sentence `text`, and optionally `with`, the nodes it rests on, as {label, name}.
# Generated once from the note's *Lean:* paragraphs; edit by hand when the note changes (the
# generator fails if a label is missing from the note, or a declaration from Lean).

