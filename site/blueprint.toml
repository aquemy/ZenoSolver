[[node]]
section = "symmetric"
label = "Corollary 4.8"
lean = ["ZenoFront.minimal_achievable_iff_multisetPoints"]
paper = ["arxiv-prop1"]
strengthen = """
**Proposition I, corrected.** Both papers state that Pareto-optimal *plans* use exactly $2t-p$
landings. That is false as stated (with zero costs a plan with more landings can be Pareto-optimal;
see the remark below the corollary), and the papers' proofs do not establish the reduction. What
holds, and is now machine-checked, is the **front** statement: the front is the Pareto set of
$(c(X), M(X))$ over multisets $X$ of $2t-p$ landings, where $M(X)$ is the least makespan of an
**admissible** partition of $X$.
"""

