[[section]]
id = "admissibility"
title = "Segments, admissible partitions, link forests"
intro = """
The combinatorial core (§2 of the note). A partition of the landings among the planes can be flown
without waiting exactly when it is *admissible*, a parity condition that is a $\\mathcal T$-join of the
plane-city incidence graph. Neither paper has this notion: it is what replaces their per-PPP greedy.
"""

[[node]]
section = "admissibility"
label = "Lemma 2.1"
leaves = ["ZenoFront.PlaneFeasible.cntA_eq"]
covers = "The Lean lemma is the count on a route after Step 1 of Theorem 4.7, read off the legs (`#A = #Ā + 1`)."

[[node]]
section = "admissibility"
label = "Definition 2.2"
paras = 3
lean =["ZenoFront.IsParityWitness", "ZenoFront.Admissible"]
paper = ["evocop-ppp"]
covers = "`IsParityWitness X h` is (h1)–(h3) with `h k : Finset (Fin n)`, one set of cities per plane; `Admissible X` is `∃ h, IsParityWitness X h`, decidable through `witnessCandidates`."
strengthen = """
**What replaces the PPP.** A PPP fixes the multiset of landings and leaves the schedule to a greedy.
The note fixes, in addition, *which plane lands where*, and characterises the partitions that some
schedule realises without waiting (Theorem 4.1) and that every plan can be reduced to (Theorem 4.7).
"""

