# Blueprint node registry: the one hand-authored map from the theory note to the Lean development.
#
# Everything else on a node is derived at build time by site/gen_blueprint.py:
#   * the statement and the prose proof are extracted from doc/theory/exact-front.md by `label`;
#   * the note's own status (P / S / O / refuted) comes from the status table in §0 of the note;
#   * the Lean listing comes from the source, located by asking Lean for each declaration's range;
#   * the badge comes from `#print axioms` (collectAxioms) on the `lean` declarations.
#
# Fields of a node:
#   label     note label ("Lemma 2.6", "Definition (link forest)") or a heading ("§5", "§1.4").
#   title     optional heading override.
#   lean      declarations that formalise the WHOLE statement. The node is badged machine-checked
#             only if every one of them is axiom-clean.
#   leaves    declarations that formalise PART of the statement. They are listed and badged
#             inline, but the node keeps the note's status: a node is never badged above what its
#             own Lean covers.
#   covers    one line: what the Lean states, when it differs in form from the note.
#   paper     verbatim extracts (site/paper/<id>.md) shown in grey boxes.
#   strengthen  markdown for a green box: what the note corrects in the papers.
#   note_status optional override of the status-table entry (used where one table row covers two
#             statements).
#   paras     for a statement without a proof in the note: how many paragraphs it has (by default
#             the first paragraph and the lists or displays that continue it; the rest is shown as
#             remarks).
#   statement markdown statement, for a Lean result with no counterpart in the note.

[[section]]
id = "model"
title = "The model"
intro = """
The instance, the plans and the Pareto front, as fixed in §1 of the note. The papers define the
model informally; the note makes plans precise (routes, journeys, capacity, waiting) and the Lean
development transcribes that definition. Definitions are the trusted interface of the whole
formalization: every theorem below is about these objects.
"""

[[node]]
section = "model"
label = "§1.1"
title = "Instances"
lean = ["ZenoFront.Network"]
paper = ["evocop-model", "arxiv-model"]
covers = "`Network` holds the durations `d`, `dbar` and an arbitrary table `dc` of central flights; costs are a separate argument `c : Fin n → ℕ`. Durations, costs and times are natural numbers (format v1); `Cert.check_sound_rat` extends the checker's soundness to rational times."

[[node]]
section = "model"
label = "§1.2"
title = "Plans, cost and makespan"
lean = ["ZenoFront.Plan", "ZenoFront.Feasible", "ZenoFront.achievable"]
covers = "A plan gives every plane a list of legs (`Leg`: from, to, departure, arrival, passenger). `Feasible` requires routes chained from `C_I` at time ≥ 0 and ending in `C_G`, legs of exact duration, and every passenger's legs ordered into a route from `C_I` to `C_G`; capacity one holds by construction, since a leg names at most one passenger."
strengthen = """
**What the note makes precise.** Neither paper defines a plan. Both reason with flight *patterns*
(P1–P3; $A$, $\\bar A$, $B$, $\\bar B$) and treat waiting informally. The note's definition, and its Lean
transcription, allow every behaviour a planner could produce: central flights of any duration,
waiting anywhere, hand-offs anywhere, zero durations. Every lower bound below is proved against
*all* such plans, not against pattern plans.
"""

