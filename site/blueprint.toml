[[node]]
section = "algorithm"
label = "Verified solver"
title = "The verified solver `zeno-front`"
lean = ["ZenoFront.solveFront_isParetoFront"]
statement = """
Under (S) and (A1), with $1 \\le p \\le t$, the list computed by `solveFront` is exactly the Pareto
front of the feasible plans. The solver finds the levels where $E$ drops by splitting intervals
between $d_{\\min}\\lceil s/p\\rceil$ and $(2t-p)\\,d_{\\max}$; at each level it takes $L(T)$ when the bracket
$L(T) \\le E(T) \\le U_2(T)$ closes, and otherwise runs the link-forest DP or the σ-DP, whichever is
estimated cheaper. `lake exe zeno-front FILE` runs it.
"""
covers = "This is a Lean result with no single counterpart in the note: it assembles Corollary 4.8, Proposition 7.1, Theorems 7.5 and 7.6 and the bracket of Proposition 7.3 into one executable function and one theorem."

