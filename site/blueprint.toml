# The main results, shown first on the page: the four headline theorems of §0 of the note, and the
# two results the non-symmetric front and the solver rest on.

[[main]]
label = "Theorem 4.5"
name = "The symmetric front (H1)"
text = '''Under (S) and the hub triangles (H), with $p \le t$, the Pareto front is the set of minimal
points $(c(X), M(X))$ over the multisets $X$ of $s = 2t - p$ central landings, $M(X)$ the least
largest load of an admissible partition of $X$; the same holds for planes ending anywhere.'''
with = [
  { label = "Theorem 4.1", name = "achievability" },
  { label = "Theorem 4.4", name = "the converse under (S) and (H)" },
]

[[main]]
label = "Theorem 5.3"
name = "Schedulable domination"
text = '''Under (A1-NS), every feasible plan is weakly dominated by a valid scheduled configuration of no
larger cost whose template value, the makespan of its template plan, is at most the plan's.'''

[[main]]
label = "Corollary 5.6"
name = "The non-symmetric front (H4)"
text = '''Under (A1-NS), with $p \le t$, the Pareto front is the set of minimal points $(c(S),
M_{\rm tmpl}(S))$ of the valid scheduled configurations with $2t - p$ landings.'''
with = [
  { label = "Theorem 5.3", name = "schedulable domination" },
  { label = "Lemma 5.5", name = "template plans" },
]

[[main]]
label = "Theorem 6.7"
name = "The link-forest DP is exact"
text = '''The dynamic program over link forests computes $E(T)$, the least cost of an admissible
partition whose loads are all at most $T$.'''

[[main]]
label = "Theorem 6.9"
name = "The verified solver (H2)"
text = '''Under (S) and (H), with $1 \le p \le t$, `solveFront` returns exactly the Pareto front;
`lake exe zeno-front` runs it.'''

[[main]]
label = "Theorem 8.2"
name = "The v1 checker is sound (H3)"
text = '''A format v1 certificate that `Cert.check` accepts lists exactly the Pareto front, for every
central table satisfying (H), and for every table if all its gaps are `relaxed`.'''

[[main]]
label = "Theorem 8.7"
name = "The v2 checker is sound (H3)"
text = '''For non-symmetric instances, a format v2 certificate that `Cert2.check` accepts lists exactly the
Pareto front, for every central table satisfying (A1-NS) when the certificate lists it, and for
every table otherwise.'''
