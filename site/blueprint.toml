# Blueprint node registry: the one hand-authored map from the theory note to the Lean development.
#
# Everything else on a node is derived at build time by site/gen_blueprint.py:
#   * the statement and the prose proof are extracted from doc/theory/exact-front.md by `label`;
#   * the note's own status (P / S / O / refuted) comes from the status table in §0 of the note;
#   * the Lean listing comes from the source, located by asking Lean for each declaration's range;
#   * the badge comes from the claim ledger, ../claims.toml: a node that is a claim there (Theorem
#     4.7 is thm-4-7) is machine-checked only if the ledger's effective status is
#     math.machine-checked, which requires Lean to prove every assertion of the statement, and then
#     its `lean` declarations must be axiom-clean (`#print axioms`, collectAxioms). Otherwise it has
#     parts in Lean (the ledger's `lean_partial`) or is informal. The declarations shown are the
#     ledger's; `lean` and `leaves` below add related ones. Nodes that are not claims are badged
#     from their own `lean` declarations.
#
# Fields of a node:
#   label     note label ("Lemma 2.6", "Definition (link forest)") or a heading ("§5", "§1.4").
#   title     optional heading override.
#   lean      declarations that formalise the WHOLE statement (for a node that is not a claim of
#             the ledger, the badge is machine-checked only if every one of them is axiom-clean).
#   leaves    declarations that formalise PART of the statement.
#   gap       one line, shown under the badge of a node with parts in Lean: what the Lean proves
#             and what it misses, from the ledger's review record. Required for such a node.
#   covers    what the Lean states, when it differs in form from the note (in the Lean details).
#   note_status optional override of the status-table entry (used where one table row covers two
#             statements).
#   paras     for a statement without a proof in the note: how many paragraphs it has (by default
#             the first paragraph and the lists or displays that continue it; the rest is shown as
#             remarks).
#   statement markdown statement, for a Lean result with no counterpart in the note.
#
# The blueprint keeps the positive results. Refuted conjectures, counterexamples, the greedy
# counterexample of §5 and the general-graph reduction of §6.6 stay in the note only: the labels in
# `note_only` are cited elsewhere on the site, and the `node` shortcode links them to their section
# of the note on GitHub. A label that is neither a node nor in `note_only` fails the build.
#
# [[main]] lists the main results shown at the top of the page, in order: `label` (a node), `name`,
# a one-sentence `text`, and optionally `with`, the nodes it rests on, as {label, name}.

note_only = [
  "Example 4.13", "§5", "Conjecture 6.5", "Proposition 6.5", "Conjecture 6.7", "Definition 6.17",
  "Proposition 6.7", "Proposition 6.18", "Example 6.11", "Proposition 6.12", "Proposition 6.13",
  "Proposition 6.14", "Proposition 6.15", "Proposition 6.16", "Conjecture 10.2",
]

