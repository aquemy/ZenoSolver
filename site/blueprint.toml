reduces every plan to one, and together they give the front (Theorem 4.5). Example 4.6 shows a
Pareto-optimal plan with more than $2t - p$ landings, Example 4.7 that (H) cannot be dropped, and
Proposition 4.8 that the greedies of the 2015 and 2023 papers are not exact.
'''

