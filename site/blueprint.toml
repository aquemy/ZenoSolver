# The main results, shown first on the page. Each sentence states what its badge covers: where Lean
# proves a narrower form, the sentence says which.

[[main]]
label = "Corollary 4.8"
name = "The front theorem"
text = '''Under (S) and (A1), the Pareto front is the set of minimal points $(c(X), M(X))$ over the
multisets $X$ of $s = 2t - p$ central landings, where $M(X)$ is the least largest load of an
admissible partition of $X$.'''
with = [
  { label = "Theorem 4.1", name = "achievability; Lean builds the plan with its cost and makespan, the part the front theorem uses" },
  { label = "Theorem 4.7", name = "the converse under (A1)" },
  { label = "Theorem 4.10", name = "the converse under (AΔ)" },
]

[[main]]
label = "Theorem 6.1"
name = "Role configurations bound every non-symmetric plan"
text = '''Under (A1-NS), every feasible plan has a role configuration with $t$ passengers, no larger
cost and every role load at most the plan's makespan: the form Lean proves, and the one the checker
uses.'''

[[main]]
label = "Theorem 6.9"
name = "Schedulable domination"
text = '''Under (A1-NS), every feasible plan is matched by a role configuration of no larger cost with
orders and a link matching whose template has makespan at most the plan's. Lean proves the bound on
the template's closed form; that the closed form is the template's makespan is Lemma 6.3, written
only.'''

[[main]]
label = "Theorem 7.5"
name = "The link-forest DP is exact"
text = '''The dynamic program over link forests computes $E(T)$, the least cost of an admissible
partition whose loads are all at most $T$. Lean proves this equality, not the DP's time and memory
bounds.'''

[[main]]
label = "Theorem 7.6"
name = "The σ-DP is exact"
text = '''A shortest path over parity states also computes $E(T)$. Lean proves it for the σ-DP on the
non-dominated cities, the form the solver runs.'''

[[main]]
label = "Verified solver"
name = "The verified solver"
text = '''Under (S) and (A1), with $1 \le p \le t$, `solveFront` returns exactly the Pareto front;
`lake exe zeno-front` runs it.'''

[[main]]
label = "Theorem 9.1"
name = "Certificates are sound"
text = '''If a certificate's four obligations hold, its points are exactly the Pareto front. Lean
proves it for the gap bounds its own checker supports, so a certificate that the Lean checker
accepts lists exactly the front.'''

[[main]]
label = "Version 2 checker"
name = "The non-symmetric checker is sound"
text = '''For non-symmetric instances, a version 2 certificate that `Cert2.check` accepts lists exactly
the Pareto front, under (A1-NS) when it uses a gap kind other than `relaxed`.'''

