[[section]]
id = "symmetric"
title = "Symmetric case: achievability, converse, front"
intro = """
The heart of the note (§4). Theorem 4.1 flies every admissible partition with no waiting;
Theorem 4.7 reduces every plan to an admissible partition; together they characterise the front
(Corollary 4.8). All three are machine-checked.
"""

[[node]]
section = "symmetric"
label = "Theorem 4.1"
lean = ["ZenoFront.Admissible.exists_plan"]
paper = ["evocop-construction"]
covers = "The plan is built on a rooted link forest (`LTree.routes`): each plane drops off its children's passengers, crosses its free landings, then picks up its parent's passenger."
strengthen = """
**The papers' construction, made precise.** The papers' rule (westward parts of P3 early, eastward
parts late) is right, but it is applied to whatever the greedy produced. The link forest guarantees
that every plane picks up **at most once**, which is exactly what makes the no-waiting timing
argument go through.
"""

