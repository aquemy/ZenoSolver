intro = """
§7 of the note turns Corollary 4.8 into a pseudo-polynomial algorithm: the front is the set of
breakpoints of $E(T)$, the least cost of an admissible partition with loads at most $T$. Both exact
dynamic programs are proved equal to $E(T)$ in Lean, and the verified solver `zeno-front` is built
on them.
"""

