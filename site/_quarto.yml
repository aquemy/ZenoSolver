# ZenoSolver website, rendered into ../docs for classic GitHub Pages (master, /docs).
# Build: bash site/build.sh. Generated, do not edit by hand: the blueprint partials (proofs/_*.qmd)
# and _nodes.json (gen_blueprint.py), the result tables (_results-*.md, gen_pages.py), the claim
# graph (graph/, _graph-*.md, _history-table.md, gen_graph.py), the instance fronts
# (instances/fronts.json, gen_fronts.py), the problem-page data (problem/, gen_problem.py) and the
# algorithm-page data (algorithm/, gen_algorithm.py).
project:
  type: website
  output-dir: ../docs
  render:
    - index.qmd
    - problem.qmd
    # the paper, on one page; its sections are the partials paper/_*.qmd
    - paper/index.qmd
    - instances/index.qmd
    - instances/model.qmd
    - instances/generator.qmd
    - instances/pddl.qmd
    - instances/suites.qmd
    - instances/known-fronts.qmd
    - instances/sizing.qmd
    - solver/install.qmd
    - solver/cli.qmd
    - solver/api.qmd
    - solver/certificates.qmd
    - solver/lean.qmd
    - solver/algorithm.qmd
    - results.qmd
    - proofs.qmd
    - claimgraph.qmd
    - history.qmd
    - about.qmd
    - blueprint.qmd
  # generated data and assets that pages load at run time
  resources:
    - graph/
    - js/
    - problem/*.json
    - problem/*.dat
    - algorithm/*.json
    - algorithm/*.svg
    - instances/fronts.json
    - paper/figures/
    - images/
    # redirects from the former paper pages, and from /experiments.html, to their section of
    # paper/index.html (Quarto aliases cannot point to an anchor)
    - paper/*.html
    - experiments.html

website:
  title: "ZenoSolver"
  site-url: https://quemy.info/ZenoSolver/
  repo-url: https://github.com/aquemy/ZenoSolver
  description: "Exact Pareto fronts of MultiZenoTravel planning instances, with certificates and a Lean 4 formalization."
  reader-mode: false
  search: true
  page-navigation: true
  page-footer:
    left: "ZenoSolver, its theory note and the Lean formalization: Alexandre Quemy."
  navbar:
    left:
      - text: "Problem"
        href: problem.qmd
      - text: "Paper"
        href: paper/index.qmd
      - text: "Instances"
        href: instances/index.qmd
      - text: "Solver"
        href: solver/install.qmd
      - text: "Theory"
        menu:
          - text: "Blueprint"
            href: proofs.qmd
          - text: "Claim graph"
            href: claimgraph.qmd
          - text: "History"
            href: history.qmd
          - text: "Blueprint (PDF)"
            href: blueprint.pdf
      - text: "About"
        href: about.qmd
    right:
      - icon: github
        href: https://github.com/aquemy/ZenoSolver
        aria-label: "GitHub repository"
  # The paper is a single page, navigated by its table of contents, so it has no sidebar.
  sidebar:
    - id: instances
      title: "Instances"
      style: docked
      contents:
        - instances/index.qmd
        - instances/model.qmd
        - instances/generator.qmd
        - instances/pddl.qmd
        - instances/suites.qmd
        - instances/known-fronts.qmd
        - instances/sizing.qmd
    - id: solver
      title: "Solver"
      style: docked
      contents:
        - solver/install.qmd
        - solver/cli.qmd
        - solver/api.qmd
        - solver/algorithm.qmd
        - solver/certificates.qmd
        - solver/lean.qmd
        - results.qmd

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: [styles/tokens.css, styles/provenance.css, styles/site.css]
    toc: true
    toc-depth: 3
    code-overflow: wrap
    anchor-sections: true
    smooth-scroll: true

shortcodes:
  - shortcodes/node.lua

filters:
  - filters/provenance.lua
