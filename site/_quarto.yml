# ZenoSolver website, rendered into ../docs for classic GitHub Pages (master, /docs).
# Build: bash site/build.sh. The blueprint partials (proofs/_*.qmd), the result tables
# (_results-*.md) and the claim graph (graph/, _graph-*.md, _history-table.md) are generated by
# gen_blueprint.py, gen_pages.py and gen_graph.py; do not edit them by hand.
project:
  type: website
  output-dir: ../docs
  render:
    - index.qmd
    - solver/install.qmd
    - solver/cli.qmd
    - solver/api.qmd
    - solver/certificates.qmd
    - solver/lean.qmd
    - solver/algorithm.qmd
    - instances/model.qmd
    - instances/generator.qmd
    - instances/pddl.qmd
    - instances/suites.qmd
    - instances/known-fronts.qmd
    - instances/sizing.qmd
    - proofs.qmd
    - claimgraph.qmd
    - history.qmd
    - experiments.qmd
    - results.qmd
    - about.qmd
    - blueprint.qmd
  # the claim-graph viewer, the history timeline and the graph's JSON, written by gen_graph.py
  resources:
    - graph/

website:
  title: "ZenoSolver"
  site-url: https://quemy.info/ZenoSolver/
  repo-url: https://github.com/aquemy/ZenoSolver
  description: "Exact Pareto fronts of MultiZenoTravel planning instances, with certificates and a Lean 4 formalization."
  reader-mode: true
  search: true
  page-navigation: true
  page-footer:
    left: "ZenoSolver, its theory note and the Lean formalization: Alexandre Quemy."
    right: "Original papers: Quemy & Schoenauer (EvoCOP 2015); Quemy, Schoenauer & Dréo (arXiv:2304.14659)."
  navbar:
    left:
      - text: "Home"
        href: index.qmd
      - text: "Solver"
        menu:
          - text: "Installation and build"
            href: solver/install.qmd
          - text: "Command line"
            href: solver/cli.qmd
          - text: "C++ library"
            href: solver/api.qmd
          - text: "Certificate format"
            href: solver/certificates.qmd
          - text: "Lean tools"
            href: solver/lean.qmd
          - text: "Algorithm"
            href: solver/algorithm.qmd
      - text: "Instances"
        menu:
          - text: "Model and data files"
            href: instances/model.qmd
          - text: "Generator"
            href: instances/generator.qmd
          - text: "PDDL"
            href: instances/pddl.qmd
          - text: "Benchmark and golden suites"
            href: instances/suites.qmd
          - text: "Instances with known fronts"
            href: instances/known-fronts.qmd
          - text: "Size guidance"
            href: instances/sizing.qmd
      - text: "Theory"
        menu:
          - text: "Blueprint"
            href: proofs.qmd
          - text: "Claim graph"
            href: claimgraph.qmd
          - text: "History"
            href: history.qmd
          - text: "Blueprint (PDF)"
            href: blueprint.pdf
      - text: "Experiments"
        href: experiments.qmd
      - text: "Results"
        href: results.qmd
      - text: "About"
        href: about.qmd
    right:
      - icon: github
        href: https://github.com/aquemy/ZenoSolver
        aria-label: "GitHub repository"
      - icon: file-pdf
        href: blueprint.pdf
        aria-label: "Blueprint as a PDF"

format:
  html:
    theme: cosmo
    css: [styles/provenance.css, styles/site.css]
    toc: true
    toc-depth: 3
    code-overflow: wrap
    anchor-sections: true
    smooth-scroll: true

filters:
  - filters/provenance.lua
