name: Lean

# Also runs on changes to the C++ solver, so that the end-to-end step catches any drift between
# the certificates the solver writes and what the Lean checker accepts, and on changes to the claim
# ledger and the theory note, which the ledger gate checks against the kernel.
on:
  push:
    branches: [master]
    paths:
      - "lean/**"
      - "src/**"
      - "include/**"
      - "tests/golden/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "claims.toml"
      - "doc/theory/exact-front.md"
      - "site/check_ledger.py"
      - ".github/workflows/lean.yml"
  pull_request:
    paths:
      - "lean/**"
      - "src/**"
      - "include/**"
      - "tests/golden/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "claims.toml"
      - "doc/theory/exact-front.md"
      - "site/check_ledger.py"
      - ".github/workflows/lean.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and audit ZenoFront
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Reject sorry and admit in the sources
        run: |
          if grep -rnwE 'sorry|admit' lean/ZenoFront lean/ZenoFront.lean lean/ZenoCheck.lean \
              lean/ZenoFrontMain.lean; then
            echo "::error::sorry or admit found in ZenoFront"
            exit 1
          fi

      # Installs elan and the pinned toolchain, downloads the Mathlib cache
      # (`lake exe cache get`, never a source build of Mathlib) and runs `lake build`.
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          use-mathlib-cache: true
          build-args: --wfail
          test: false
          lint: false

      # Fails if any ZenoFront declaration depends on an axiom other than propext,
      # Classical.choice and Quot.sound (this rejects sorryAx and native_decide).
      - name: Axiom audit
        working-directory: lean
        run: lake env lean scripts/CheckAxioms.lean

      # The ledger gate (site/check_ledger.py): every claim of claims.toml that is not archived
      # (`removed`) or an experiment is math.machine-checked or math.disproved, a machine-checked
      # claim names its Lean, the kept claims are exactly the numbered results of the theory note,
      # and every declaration named in `lean` or `lean_partial` exists and uses no axiom beyond
      # the three standard ones (it generates and runs lean/scripts/LedgerNames.lean).
      - name: Ledger gate
        run: python3 site/check_ledger.py --lean

      # The compiled checker: the solver's certificates (relaxed and forest gaps) must be
      # accepted, and the corrupted ones rejected.
      - name: Build zeno-check
        working-directory: lean
        run: lake build zeno-check

      - name: Check the test certificates
        working-directory: lean
        run: bash test/run.sh

      - name: Time the largest certificate
        working-directory: lean
        run: time .lake/build/bin/zeno-check test/certificates/accepted/relaxed-r101.cert

      # End to end: the C++ solver writes a certificate for every golden instance and for the
      # random instances of lean/test/instances (some with forest gaps); the Lean checker must
      # accept all of them.
      - name: Build the C++ solver
        env:
          CXX: g++-14
        run: |
          cmake --preset release
          cmake --build --preset release --parallel --target zeno

      - name: End to end, C++ certificates checked by Lean
        run: bash lean/test/e2e.sh build/release/zeno lean/.lake/build/bin/zeno-check

      # The verified solver (ZenoFront.solveFront_isParetoFront): on the golden instances, the
      # quick suite and three regimes of the benchmark suite, its front must equal `zeno front`'s.
      - name: Build zeno-front
        working-directory: lean
        run: lake build zeno-front

      - name: Verified solver against zeno front
        run: |
          bash lean/test/front.sh build/release/zeno lean/.lake/build/bin/zeno-front "$(mktemp -d)" \
            "tests/golden/instances.txt|tests/golden/data" "bench/instances/quick.txt|bench/instances/data" \
            "lean/test/front-regimes.list|bench/instances/data"
