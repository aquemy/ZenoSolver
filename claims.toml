# claims.toml: the CKC claim registry for ZenoSolver.
#
# One entry per numbered result of the theory note doc/theory/exact-front.md (revision 3), plus the
# refuted claims of the papers it corrects, the archived results of revision 2 and the experiments.
#
# The slug (table key) is the claim's STABLE ID: commit footers reference it as `claim:<slug>` or
# `conjecture:<slug>`, so it never changes, even when the note renumbers its results. `label` is the
# CURRENT number of the result in the note ("Corollary 5.4"); everything user-visible (the site, the
# blueprint, the claim graph) shows the label. `removed` ARCHIVES an entry: the result left the note,
# the entry stays so that the history's footers still resolve, and the tools skip it.
# doc/theory/revision-3-map.md maps the numbers of revision 2 to those of revision 3 (Table C).
#
# `status` is a CACHE of the effective status computed from the commit graph
# (`claimgraph status . --claims claims.toml`); regenerate it, do not treat it as the source of
# truth. The commits are the record: a status changes only by a new commit.
#
# Slugs: `<kind>-<number with dots as dashes>`, the number being the one the result had when it
# entered the ledger (revision 2), with the kind read from that label:
#   def  Definition    lem   Lemma        thm  Theorem       prop  Proposition
#   cor  Corollary     conj  Conjecture   claim  Statement, example, or a statement located by its section
# so Theorem 6.1 of revision 2 is thm-6-1, labelled Corollary 5.4 in revision 3. A result new in
# revision 3 gets a descriptive slug `<kind>-<description>`, the kind read from its label
# (def-instance, lem-rounding, prop-dominance-ns, thm-verified-solver). The papers' claims are
# paper-greedy-optimal, paper-no-harmful-waiting and paper-general-graph-reduction; the converse
# under (S) alone is claim-converse-s-only. Experiments are exp-<id>, at the end of this file.
#
# Fields:
#   label         the current label in the note (kept results only; refuted claims and
#                 experiments have none)
#   removed       "<date>: <reason>", or "<date>: merged into <label> (<slug>)": archived
#   kind          definition, lemma, theorem, proposition, corollary, conjecture, claim or experiment
#   statement     one or a few sentences, the note's statement. For a kernel-checked claim it may end
#                 with the "Lean form": how the Lean statement encodes the note's.
#   status        cache of the effective status (legend below)
#   lean          the Lean declarations whose kernel proof is the claim (math.machine-checked), or
#                 that refute it (math.disproved); for an archived entry, those that proved it when
#                 it was archived (they may be deleted since)
#   lean_partial  further Lean declarations that prove steps or parts of the claim
#   paper         the locus in the note (or in the papers)
#   created       the date the note first stated the claim
#
# The CI gate site/check_ledger.py (Lean workflow) checks that every claim without `removed`, other
# than an experiment, is math.machine-checked or math.disproved, that every machine-checked claim
# names its `lean`, and that every name in `lean` and `lean_partial` of such a claim exists in Lean
# with no axiom beyond propext, Classical.choice and Quot.sound.
#
# Sources: the note doc/theory/exact-front.md; A. Quemy, M. Schoenauer, "True Pareto Fronts for
# Multi-Objective AI Planning Instances", EvoCOP 2015, LNCS 9026 (hal-01109777); A. Quemy,
# M. Schoenauer, J. Dreo, arXiv:2304.14659 (2023). The papers' errors: doc/erratum.md.
#
# Status legend (axis 2, epistemic):
#   math.machine-checked  clean Lean kernel proof (Axioms: only propext, Classical.choice, Quot.sound)
#                         of every assertion of the statement, up to the Lean model's encoding
#   math.proved-informal  complete written proof in the note (P); Lean may prove part (lean_partial)
#   math.conjectured      open (O) or only sketched (S) in the note
#   math.disproved        refuted by a counterexample

# ===========================================================================
# 1. Model
# ===========================================================================

[claims.def-instance]
label     = "Definition 1.1"
kind      = "definition"
statement = "Definition 1.1 (instance): Two hubs C_I (initial) and C_G (goal) and central cities 1, …, n. Durations are natural numbers: the flight between C_I and i lasts d_i in either direction, the flight between i and C_G lasts d̄_i, and for every ordered pair (i, j) of central cities, i = j included, the central flight from i to j lasts dc(i, j); no flight joins the two hubs. Landing in central city i costs c_i ∈ ℕ, landing in a hub is free. There are p planes and t passengers, all in C_I at time 0, and a plane carries at most one passenger. Results assume 1 ≤ p ≤ t where they use it."
status    = "math.machine-checked"
lean      = "ZenoFront.Network, ZenoFront.Network.duration"
paper     = "Definition 1.1, doc/theory/exact-front.md §1.1"
created   = "2026-11-25"

[claims.def-plan]
label     = "Definition 1.2"
kind      = "definition"
statement = "Definition 1.2 (plan): A leg is a tuple (origin, destination, departure, arrival, passenger or none) with natural-number times, and a plan gives each plane a list of legs. It is feasible if (1) every leg is a flight, arriving at its departure plus the flight's duration; (2) the legs of each plane form a route from C_I at time 0 (each leg leaves where the previous one arrived, no earlier than that arrival) whose last leg arrives in C_G; (3) for every passenger, the legs that carry it form, in some order, such a route from C_I at time 0 ending in C_G. The cost is the sum of the landing costs of the legs into central cities, the makespan the latest end of a route, the flight time F_k of plane k the sum of the durations of its legs. In the variant with planes ending anywhere, item 2 only asks for a route from C_I at time 0, possibly empty, and the makespan is the latest arrival of a leg."
status    = "math.machine-checked"
lean      = "ZenoFront.Leg, ZenoFront.Plan, ZenoFront.Flies, ZenoFront.IsRoute, ZenoFront.PlaneFeasible, ZenoFront.Feasible, ZenoFront.planCost, ZenoFront.planMakespan, ZenoFront.durSum, ZenoFront.achievable, ZenoFront.PlaneFeasibleAnywhere, ZenoFront.FeasibleAnywhere, ZenoFront.achievableAnywhere"
paper     = "Definition 1.2, doc/theory/exact-front.md §1.2"
created   = "2026-11-25"

[claims.lem-rounding]
label     = "Lemma 1.3"
kind      = "lemma"
statement = "Lemma 1.3 (rounding times): Let 𝕂 be an ordered ring with a floor function, such as ℚ or ℝ, and let a plan have departures and arrivals in 𝕂 (and the instance's integer durations) and satisfy items 1–3 of Definition 1.2. Rounding every time down gives a feasible plan with natural-number times, the same cost and a makespan at most the original one. Conversely, a feasible plan with natural-number times, read in 𝕂, satisfies items 1–3 with the same cost and makespan."
status    = "math.machine-checked"
lean      = "ZenoFront.QFeasible, ZenoFront.QFeasible.floor, ZenoFront.qPlanCost_eq, ZenoFront.planMakespan_floor_le, ZenoFront.Feasible.toRat"
paper     = "Lemma 1.3, doc/theory/exact-front.md §1.2"
created   = "2026-11-25"

[claims.def-assumptions]
label     = "Definition 1.4"
kind      = "definition"
statement = "Definition 1.4 (assumptions): (S) d̄_i = d_i for all i. (A1) d_i + d_j ≤ dc(i, j) for all central i, j. (A1-NS) min(d_i + d_j, d̄_i + d̄_j) ≤ dc(i, j) for all central i, j. (AΔ) dur(a, b) ≤ dur(a, x) + dur(x, b) whenever a ≠ b and the three flights exist. (H) the hub triangles: d_j ≤ d_i + dc(i, j) and d_i ≤ dc(i, j) + d_j for all central i, j (the triangles through C_I, and under (S) through C_G)."
status    = "math.machine-checked"
lean      = "ZenoFront.Network.A1, ZenoFront.Network.A1NS, ZenoFront.Network.ATri, ZenoFront.Network.ATriHub"
paper     = "Definition 1.4, doc/theory/exact-front.md §1.4"
created   = "2026-11-25"

[claims.lem-hub-triangles]
label     = "Lemma 1.5"
kind      = "lemma"
statement = "Lemma 1.5 (hub triangles): (A1) implies (H), and (AΔ) implies (H)."
status    = "math.machine-checked"
lean      = "ZenoFront.Network.A1.hub, ZenoFront.Network.ATri.hub"
paper     = "Lemma 1.5, doc/theory/exact-front.md §1.4"
created   = "2026-11-25"

[claims.def-front]
label     = "Definition 1.6"
kind      = "definition"
statement = "Definition 1.6 (fronts): Points (cost, makespan) of ℕ² are ordered componentwise, and y weakly dominates z if y ≤ z. Min S is the set of the minimal points of S; the front is F = Min A, A (A′) the set of the points of the feasible plans (of the plans whose planes end anywhere). A list is the Pareto front of S if its points lie in S, every point of S is weakly dominated by a listed point, and the listed points are pairwise incomparable."
status    = "math.machine-checked"
lean      = "ZenoFront.achievable, ZenoFront.achievableAnywhere, ZenoFront.IsParetoFront"
paper     = "Definition 1.6, doc/theory/exact-front.md §1.5"
created   = "2026-11-25"

[claims.lem-1-1]
label     = "Lemma 1.7"
kind      = "lemma"
statement = "Lemma 1.7 (dominating sets): (a) If every point of A is weakly dominated by a point of B and every point of B by a point of A, then Min A = Min B; in particular when B ⊆ A and every point of A is weakly dominated by a point of B. (b) A list that is the Pareto front of S lists exactly the points of Min S."
status    = "math.machine-checked"
lean      = "ZenoFront.minimal_iff_of_dominated, ZenoFront.minimal_iff_of_subset_of_dominated, ZenoFront.IsParetoFront.mem_iff_minimal"
paper     = "Lemma 1.7, doc/theory/exact-front.md §1.5"
created   = "2026-11-23"

# ===========================================================================
# 2. Admissible partitions
# ===========================================================================

[claims.def-2-2]
label     = "Definition 2.1"
kind      = "definition"
statement = "Definition 2.1 (admissible partition): A partition of a multiset X over p planes is a family of groups X_1, …, X_p with Σ_k X_k = X. A parity matrix gives every plane k a set η_k of central cities with (h1) η_k ⊆ supp X_k, (h2) |η_k| ≡ |X_k| + 1 (mod 2) and (h3) every city in an even number of the η_k. The partition is admissible if it has a parity matrix."
status    = "math.machine-checked"
lean      = "ZenoFront.IsParityWitness, ZenoFront.Admissible"
paper     = "Definition 2.1, doc/theory/exact-front.md §2"
created   = "2026-11-23"

[claims.lem-2-3]
label     = "Lemma 2.2"
kind      = "lemma"
statement = "Lemma 2.2 (integer form): A partition is admissible iff some h̃ ∈ ℕ^{p×n} has h̃_{k,i} ≤ X_k(i) for all k, i, Σ_i h̃_{k,i} ≡ |X_k| + 1 (mod 2) for every plane k, and Σ_k h̃_{k,i} even for every city i."
status    = "math.machine-checked"
lean      = "ZenoFront.admissible_iff_exists_natWitness"
paper     = "Lemma 2.2, doc/theory/exact-front.md §2"
created   = "2026-11-23"

[claims.lem-2-4]
label     = "Lemma 2.3"
kind      = "lemma"
statement = "Lemma 2.3 (disjoint groups): If no city lies in two groups, the partition is admissible iff every group has odd size. Lean form: no city in two groups is ∀ i k k', i ∈ X k → i ∈ X k' → k = k'."
status    = "math.machine-checked"
lean      = "ZenoFront.admissible_iff_odd_of_disjoint"
paper     = "Lemma 2.3, doc/theory/exact-front.md §2"
created   = "2026-11-23"

[claims.lem-2-5]
label     = "Lemma 2.4"
kind      = "lemma"
statement = "Lemma 2.4 (row bound): For every parity matrix and plane k, |η_k| + 1 ≤ |X_k|. Hence the groups of an admissible partition are non-empty, and |X| ≡ p (mod 2)."
status    = "math.machine-checked"
lean      = "ZenoFront.IsParityWitness.card_add_one_le, ZenoFront.Admissible.card_pos, ZenoFront.IsParityWitness.size_mod_two"
paper     = "Lemma 2.4, doc/theory/exact-front.md §2"
created   = "2026-11-23"

[claims.def-link-forest]
label     = "Definition 2.5"
kind      = "definition"
statement = "Definition 2.5 (link forest): A rooted link tree is a plane with a multiset of free landings and a list of children, each a rooted link tree hung from the plane by a link labelled with a central city. The group of a plane consists of its free landings, one copy of the label of each of its child links and one copy of the label of its parent link (none for a root). (F2): every plane has an odd number of free landings. A link forest of a partition is a list of rooted link trees satisfying (F2) whose groups are the groups of the partition, up to relabelling the planes."
status    = "math.machine-checked"
lean      = "ZenoFront.LTree, ZenoFront.LKids, ZenoFront.LTree.groups, ZenoFront.LTree.WF, ZenoFront.forestGroups"
paper     = "Definition 2.5, doc/theory/exact-front.md §2"
created   = "2026-11-25"

[claims.lem-2-6]
label        = "Lemma 2.6"
kind         = "lemma"
statement    = "Lemma 2.6 (link forests): A partition is admissible iff it has a link forest."
status       = "math.machine-checked"
lean         = "ZenoFront.admissible_iff_exists_linkForest"
lean_partial = "ZenoFront.Admissible.exists_linkForest, ZenoFront.admissible_forestPartition"
paper        = "Lemma 2.6, doc/theory/exact-front.md §2"
created      = "2026-11-23"

[claims.lem-2-8]
label        = "Lemma 2.7"
kind         = "lemma"
statement    = "Lemma 2.7 (few touched cities): Let 1 ≤ p ≤ t. An admissible partition with |X| = s has a parity matrix that touches at most min(p − 1, t − p) cities (its sets η_k together contain at most that many cities)."
status       = "math.machine-checked"
lean         = "ZenoFront.Admissible.exists_card_touched_le"
lean_partial = "ZenoFront.IsParityWitness.card_touched_le_of_minimal, ZenoFront.IsParityWitness.card_touched_le"
paper        = "Lemma 2.7, doc/theory/exact-front.md §2"
created      = "2026-11-23"

# ===========================================================================
# 3. Counting and bounds
# ===========================================================================

[claims.lem-2-1]
label     = "Lemma 3.1"
kind      = "lemma"
statement = "Lemma 3.1 (crossings outnumber returns): On a route from C_I to C_G without central flights, the visits (a leg into a central city followed by the next leg, out of it into a hub) of type A (from C_I to C_G) number one more than those of type Ā (from C_G to C_I). On a closed walk of visits, from a hub back to it, they are equally many."
status    = "math.machine-checked"
lean      = "ZenoFront.TChain.countP_isA, ZenoFront.TRoute.countP_isA, ZenoFront.TLoop.countP_isA"
paper     = "Lemma 3.1, doc/theory/exact-front.md §3"
created   = "2026-11-23"

[claims.lem-3-1]
label        = "Lemma 3.2"
kind         = "lemma"
statement    = "Lemma 3.2 (chains): (a) In a feasible plan, and in a plan whose planes end anywhere, every passenger rides a chain: legs of the plan that carry it, the first leaving C_I, each later one leaving where the previous one arrived and no earlier, all landing in central cities except the last, which arrives in C_G. (b) If the plan has no central flight, every passenger rides a leg C_I → x and then a leg x → C_G that leaves no earlier than the first one arrives."
status       = "math.machine-checked"
lean         = "ZenoFront.ToGoal, ZenoFront.Feasible.exists_chains, ZenoFront.FeasibleAnywhere.exists_chains, ZenoFront.exists_transfer_pw"
lean_partial = "ZenoFront.exists_chain, ZenoFront.ToGoal.dst_ne_ci"
paper        = "Lemma 3.2, doc/theory/exact-front.md §3"
created      = "2026-11-23"

[claims.lem-3-2]
label        = "Lemma 3.3"
kind         = "lemma"
statement    = "Lemma 3.3 (counting): In a feasible plan, 2t ≤ Σ_k h_k + p, where h_k is the number of hub arrivals (segments) of plane k."
status       = "math.machine-checked"
lean         = "ZenoFront.Feasible.le_sum_hubArrivals"
lean_partial = "ZenoFront.PlaneFeasible.ciDepartures_add_cgArrivals, ZenoFront.Feasible.le_ciDepartures, ZenoFront.Feasible.le_cgArrivals"
paper        = "Lemma 3.3, doc/theory/exact-front.md §3"
created      = "2026-11-23"

[claims.lem-3-3]
label        = "Lemma 3.4"
kind         = "lemma"
statement    = "Lemma 3.4 (segment durations): (a) A feasible plane has a multiset Z of central cities with |Z| equal to its number of hub arrivals, 2e(Z) at most its end time and c(Z) at most its landing cost. (b) Assume (S) and (H). The route of a feasible plane is the concatenation of its segments, one per hub arrival; each lands in at least one central city and flies at least 2d_y for every central city y it lands in. A chain (Lemma 3.2(a)) ends at least d_y after any of its legs arrives in a central city y. (c) On a route without central flights every visit lasts its role weight (d_x + d̄_x for a crossing, 2d_x for a drop-off, 2d̄_x for a pick-up), and the visits of a route from a hub whose legs all arrive by M last at most M in total."
status       = "math.machine-checked"
lean         = "ZenoFront.PlaneFeasible.exists_segments_emin, ZenoFront.PlaneFeasible.exists_segments_tri, ZenoFront.ToGoal.add_d_le_endTime, ZenoFront.Node.w_eq, ZenoFront.TChain.sum_w_le"
lean_partial = "ZenoFront.PlaneFeasible.exists_segments, ZenoFront.segment_bound, ZenoFront.ToGoal.arr_add_d_le"
paper        = "Lemma 3.4, doc/theory/exact-front.md §3"
created      = "2026-11-23"

[claims.lem-3-4]
label     = "Lemma 3.5"
kind      = "lemma"
statement = "Lemma 3.5 (relaxation): Let p ≤ t. Every feasible plan with cost C and makespan M has non-empty multisets Y_1, …, Y_p with Σ_k |Y_k| = s, c(Y_1 + ⋯ + Y_p) ≤ C and 2e(Y_k) ≤ M for every k, where e_i = min(d_i, d̄_i); under (S), e = d. Hence C ≥ L_e(⌊M/2⌋), where L_e(T) is the least Σ_k G_e[m_k][T] over m_1, …, m_p ≥ 1 with Σ_k m_k = s (∞ if none). Nothing is assumed on central flights."
status    = "math.machine-checked"
lean      = "ZenoFront.Feasible.exists_relaxation_emin, ZenoFront.Feasible.relaxCost_le_planCost, ZenoFront.Network.emin_eq_of_sym"
paper     = "Lemma 3.5, doc/theory/exact-front.md §3"
created   = "2026-11-23"

[claims.prop-7-10]
label        = "Proposition 3.6"
kind         = "proposition"
statement    = "Proposition 3.6 (lower bounds): Let p ≤ t. Every feasible plan costs at least s·c_min. Under (S) and 1 ≤ p, every feasible plan has makespan at least 2d_min⌈s/p⌉."
status       = "math.machine-checked"
lean         = "ZenoFront.Feasible.minOf_le_cost_emin, ZenoFront.Feasible.minOf_le_makespan"
lean_partial = "ZenoFront.minOf, ZenoFront.Feasible.minOf_le_cost"
paper        = "Proposition 3.6, doc/theory/exact-front.md §3"
created      = "2026-11-23"

# ===========================================================================
# 4. Symmetric front
# ===========================================================================

[claims.thm-4-1]
label        = "Theorem 4.1"
kind         = "theorem"
statement    = "Theorem 4.1 (achievability): Assume (S) and p ≤ t. For every central table, every admissible partition X_1, …, X_p with |X| = 2t − p is flown by a feasible plan whose planes land exactly at the groups (up to relabelling the planes), of cost c(X) and makespan 2·max_k δ(X_k)."
status       = "math.machine-checked"
lean         = "ZenoFront.Admissible.exists_plan"
lean_partial = "ZenoFront.admissiblePoints_subset_achievable"
paper        = "Theorem 4.1, doc/theory/exact-front.md §4"
created      = "2026-11-23"

[claims.lem-4-6]
label        = "Lemma 4.2"
kind         = "lemma"
statement    = "Lemma 4.2 (adding a plane): An admissible partition of q planes with 2t − q landings, t ≥ q + 1, gives an admissible partition of q + 1 planes with 2t − q − 1 landings, no larger cost, and loads bounded by every bound on the old loads. Repeating, it gives one of p planes for every q ≤ p ≤ t."
status       = "math.machine-checked"
lean         = "ZenoFront.Admissible.addPlane_of_size, ZenoFront.Admissible.addPlanes_le"
lean_partial = "ZenoFront.Admissible.addPlane, ZenoFront.Admissible.addPlanes"
paper        = "Lemma 4.2, doc/theory/exact-front.md §4"
created      = "2026-11-23"

[claims.lem-4-11]
label     = "Lemma 4.3"
kind      = "lemma"
statement = "Lemma 4.3 (shrinking): If X is admissible with at least s landings, p ≤ s and s ≡ p (mod 2), some admissible Y with Y_k ≤ X_k for every k has exactly s landings. In particular two landings can be removed when |X| ≥ p + 2."
status    = "math.machine-checked"
lean      = "ZenoFront.Admissible.exists_shrink, ZenoFront.Admissible.exists_remove_two"
paper     = "Lemma 4.3, doc/theory/exact-front.md §4"
created   = "2026-11-24"

[claims.thm-4-10]
label        = "Theorem 4.4"
kind         = "theorem"
statement    = "Theorem 4.4 (converse under (S) and (H)): Assume (S), (H) and p ≤ t. If every plane flies a route from C_I at time 0 to C_G (items 1 and 2 of Definition 1.2) and every passenger rides a chain (Lemma 3.2(a)) of legs of the plan, then some admissible partition X_1, …, X_p has |X| = 2t − p, c(X) at most the plan's cost and 2δ(X_k) ≤ F_k for every plane. In particular every feasible plan of makespan M gives such a partition, with 2δ(X_k) ≤ F_k ≤ M."
status       = "math.machine-checked"
lean         = "ZenoFront.exists_admissible_of_chains, ZenoFront.Feasible.exists_admissible_hub"
lean_partial = "ZenoFront.Feasible.exists_admissible_ATri, ZenoFront.Feasible.exists_admissible_A1_flightTime, ZenoFront.exists_admissible_of_blocks"
paper        = "Theorem 4.4, doc/theory/exact-front.md §4"
created      = "2026-11-24"

[claims.cor-4-8]
label        = "Theorem 4.5"
kind         = "corollary"
statement    = "Theorem 4.5 (symmetric front, H1): Assume (S), (H) and p ≤ t. Let 𝒫 be the set of the points (c(X), 2·max_k δ(X_k)) of the admissible partitions X with |X| = 2t − p, M(X) the least 2·max_k δ(X_k) over the admissible partitions of a multiset X into p groups (0 if there is none), and 𝒳 the set of the points (c(X), M(X)) of the multisets of 2t − p landings that have an admissible partition. Then F = Min A′ = Min 𝒫 = Min 𝒳."
status       = "math.machine-checked"
lean         = "ZenoFront.minimal_achievable_iff_anywhere_hub, ZenoFront.minimal_achievable_iff_admissiblePoints_hub, ZenoFront.minimal_achievable_iff_multisetPoints_hub"
lean_partial = "ZenoFront.minimal_admissiblePoints_iff_multisetPoints, ZenoFront.FeasibleAnywhere.exists_admissible_hub"
paper        = "Theorem 4.5, doc/theory/exact-front.md §4"
created      = "2026-11-23"

[claims.claim-prop-i-landings]
label     = "Example 4.6"
kind      = "claim"
statement = "Example 4.6 (an optimal plan with extra landings): Take n = 1, d_1 = d̄_1 = 1, c_1 = 0, t = 5 and p = 3, so s = 7, with any central table. The front is {(0, 6)}, and a feasible plan with 9 central landings attains (0, 6): every plane flies C_I → 1 → C_G → 1 → C_I → 1 → C_G from time 0, without waiting. So a Pareto-optimal plan need not have exactly 2t − p landings: Proposition I of both papers holds only in the sense of Theorem 4.5."
status    = "math.machine-checked"
lean      = "ZenoFront.PropI.cert_check, ZenoFront.PropI.front, ZenoFront.PropI.plan9, ZenoFront.PropI.centralLandings, ZenoFront.PropI.plan9_pareto"
paper     = "Example 4.6, doc/theory/exact-front.md §4; EvoCOP 2015 and arXiv:2304.14659, Proposition I"
created   = "2026-11-25"

[claims.claim-4-13]
label     = "Example 4.7"
kind      = "claim"
statement = "Example 4.7 ((H) cannot be dropped): Take d = d̄ = (2, 3, 9, 11), c = (50, 44, 17, 0), t = 6 and p = 3, so s = 9, and the symmetric central table dc(1, 2) = 1, dc(1, 3) = 5, dc(1, 4) = 6, dc(2, 3) = 3, dc(2, 4) = 6, dc(3, 4) = 1, dc(i, i) = 0. (S) holds and (H) fails (d_4 = 11 > d_3 + dc(3, 4) = 10). The plan of the note is feasible, of cost 260 and makespan 39, for every central table in which the flight 4 → 3 lasts 1, while every admissible partition of 9 landings with every δ(X_k) ≤ 19 costs at least 264. So no admissible partition has cost at most 260 and 2·max_k δ(X_k) ≤ 39: the conclusion of Theorem 4.4 fails for this plan, no point of 𝒫 weakly dominates (260, 39), and Min 𝒫, which solveFront lists, is not the Pareto front of the feasible plans."
