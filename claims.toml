[claims.lem-3-1]
kind         = "lemma"
statement    = "Lemma 3.1 (chains): (a) In a feasible plan, and in a plan whose planes end anywhere, every passenger rides a chain: legs carrying it, the first leaving C_I, each leaving where the previous one arrived and no earlier, landing in central cities until the last, which arrives in C_G. (b) If the plan has no central flight, every passenger rides a leg C_I → x and then a leg x → C_G leaving no earlier than the first one arrives."
status       = "math.machine-checked"
lean         = "ZenoFront.ToGoal, ZenoFront.Feasible.exists_chains, ZenoFront.FeasibleAnywhere.exists_chains, ZenoFront.exists_transfer_pw"
lean_partial = "ZenoFront.exists_chain, ZenoFront.ToGoal.dst_ne_ci"
paper        = "Lemma 3.1, doc/theory/exact-front.md §3"
created      = "2026-11-23"

[claims.lem-3-2]
kind         = "lemma"
statement    = "Lemma 3.2 (counting): In a feasible plan, 2t ≤ Σ_k h_k + p, where h_k is the number of hub arrivals (segments) of plane k."
status       = "math.machine-checked"
lean         = "ZenoFront.Feasible.le_sum_hubArrivals"
lean_partial = "ZenoFront.PlaneFeasible.ciDepartures_add_cgArrivals, ZenoFront.Feasible.le_ciDepartures, ZenoFront.Feasible.le_cgArrivals"
paper        = "Lemma 3.2, doc/theory/exact-front.md §3"
created      = "2026-11-23"

[claims.lem-3-3]
kind         = "lemma"
statement    = "Lemma 3.3 (segment durations): (a) A feasible plane has a multiset Z of central cities with |Z| equal to its number of hub arrivals, 2e(Z) ≤ its end time and c(Z) ≤ its landing cost. (b) Under (S) and (H) its route is the concatenation of its segments, one per hub arrival, each landing in a central city and flying at least 2d_y for every central city y it lands in; and a chain from a central city y ends at least d_y after it starts. (c) On a route without central flights the two legs of a central landing at x last its role weight, d_x + d̄_x for a crossing, 2d_x for a drop-off and 2d̄_x for a pick-up, so the role weights sum to at most the flight time."
status       = "math.machine-checked"
lean         = "ZenoFront.PlaneFeasible.exists_segments_emin, ZenoFront.PlaneFeasible.exists_segments_tri, ZenoFront.ToGoal.add_d_le_endTime, ZenoFront.roleW_landingRecs_le, ZenoFront.Node.w_eq"
lean_partial = "ZenoFront.PlaneFeasible.exists_segments, ZenoFront.segment_bound, ZenoFront.ToGoal.arr_add_d_le, ZenoFront.TChain.sum_w_le"
paper        = "Lemma 3.3, doc/theory/exact-front.md §3"
created      = "2026-11-23"

[claims.lem-3-4]
kind      = "lemma"
statement = "Lemma 3.4 (relaxation): Let p ≤ t. Every feasible plan with cost C and makespan M has non-empty multisets Y_1, …, Y_p with Σ_k |Y_k| = s, c(Y_1 + ⋯ + Y_p) ≤ C and 2e(Y_k) ≤ M for every k; under (S), e = d. Hence C ≥ L_e(⌊M/2⌋), where L_e(T) is the least Σ_k min{c(Y) : |Y| = m_k, e(Y) ≤ T} over m_1, …, m_p ≥ 1 with Σ_k m_k = s (∞ if none)."
status    = "math.machine-checked"
lean      = "ZenoFront.Feasible.exists_relaxation_emin, ZenoFront.Feasible.relaxCost_le_planCost, ZenoFront.Network.emin_eq_of_sym"
paper     = "Lemma 3.4, doc/theory/exact-front.md §3"
created   = "2026-11-23"

