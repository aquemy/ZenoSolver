[claims.thm-6-1]
kind      = "theorem"
statement = "Theorem 6.1 (converse to role configurations) [N1]: under (A1-NS), every feasible plan with cost C and makespan M gives a role configuration on all p planes with passenger count t, cost at most C and λ_k ≤ F_k ≤ M; (AΔ) is not needed. Lean form: an explicit p ≤ t, the passenger count as 2t − p landings, and λ_k ≤ M in place of λ_k ≤ F_k."
status    = "math.machine-checked"
lean      = "ZenoFront.Feasible.exists_roleConfig_ns"
paper     = "Thm 6.1, doc/theory/exact-front.md §6.1"
created   = "2026-11-23"

[claims.lem-6-2]
kind      = "lemma"
statement = "Lemma 6.2 (relaxed role loads): under (AΔ), every feasible plan with cost C and makespan M gives drop-off, pick-up and crossing multisets with |Cr_k| odd, balanced in total only, passenger count t, cost at most C and λ_k ≤ F_k ≤ M, so L_NS(T) bounds every plan of makespan at most T, shuttle triples included."
status    = "math.proved-informal"
paper     = "Lemma 6.2, doc/theory/exact-front.md §6.1"
created   = "2026-11-23"

[claims.lem-6-3]
kind      = "lemma"
statement = "Lemma 6.3 (template) [N3]: the template of a role configuration with orders and a link matching is a schedule of makespan M_tmpl = max(max_k λ_k, max over links of Pre + d_i + d̄_i + Suf), and every schedule of the same configuration, orders and matching takes at least M_tmpl; no assumption on durations is needed."
status    = "math.proved-informal"
paper     = "Lemma 6.3, doc/theory/exact-front.md §6.2"
created   = "2026-11-23"

[claims.cor-6-4]
kind      = "corollary"
statement = "Corollary 6.4 (one pick-up never waits harmfully) [W1]: under (AΔ-path), if every plane has at most one pick-up, or every plane at most one drop-off, then M_tmpl = max_k λ_k for every order and matching."
status    = "math.proved-informal"
paper     = "Cor 6.4, doc/theory/exact-front.md §6.2"
created   = "2026-11-23"

[claims.prop-6-5]
kind      = "proposition"
statement = "Proposition 6.5 (harmful waiting): for n = 2, d = (3, 19), d̄ = (3, 11), c = (5, 1), t = 7, p = 4 and no central flights, (A1-NS) and (AΔ-path) hold, the cheapest role configuration with every λ_k ≤ 73 costs 14, and no plan of makespan at most 73 costs less than 18."
status    = "math.proved-informal"
paper     = "Prop 6.5, doc/theory/exact-front.md §6.2"
created   = "2026-11-23"

[claims.prop-6-6]
kind         = "proposition"
statement    = "Proposition 6.6 (imbalance-vector DP) [N5]: the DP over planes with states (k, j, v), v the imbalance vector restricted to ‖v‖₁ ≤ t − p, has shortest path from (0, 0, 0) to (p, s, 0) of weight E_NS(T), the least cost of a role configuration with role loads at most T."
status       = "math.proved-informal"
lean_partial = "ZenoFront.BalData.value_le_totalCost"
paper        = "Prop 6.6, doc/theory/exact-front.md §6.3"
created      = "2026-11-23"

