[claims.thm-4-1]
kind         = "theorem"
statement    = "Theorem 4.1 (achievability): Assume (S) and p ≤ t. Every admissible partition X_1, …, X_p with |X| = 2t − p is flown by a feasible plan whose planes land exactly at the groups (up to relabelling the planes), of cost c(X) and makespan 2·max_k δ(X_k)."
status       = "math.machine-checked"
lean         = "ZenoFront.Admissible.exists_plan"
lean_partial = "ZenoFront.admissiblePoints_subset_achievable"
paper        = "Thm 4.1, doc/theory/exact-front.md §4.1"
created      = "2026-11-23"

[claims.def-4-2]
kind      = "definition"
statement = "Definition 4.2 (role configurations): A role configuration on p planes gives each plane multisets Dr_k (drop-offs), Pk_k (pick-ups) and Cr_k (crossings) of central cities, with |Cr_k| odd and Σ_k Dr_k = Σ_k Pk_k. Its groups are X_k = Dr_k + Pk_k + Cr_k, its cost is c(X), and the role load of plane k is λ_k = 2δ(Dr_k) + 2δ̄(Pk_k) + δ(Cr_k) + δ̄(Cr_k). The passenger count is read through the landings, |X| = 2t − p."
status    = "math.machine-checked"
lean      = "ZenoFront.RoleConfig, ZenoFront.RoleConfig.groups, ZenoFront.RoleConfig.roleLoad"
paper     = "Def 4.2, doc/theory/exact-front.md §4.2"
created   = "2026-11-23"

[claims.lem-4-3]
kind         = "lemma"
statement    = "Lemma 4.3 (records give a configuration): Every feasible plan on p planes gives a role configuration with at least 2t − p landings whose drop-offs and pick-ups are cities of landing records (Lemma 3.1) of type B (from and back to C_I) and B̄ (neither) of their plane, and whose crossings are exactly the cities of its records of type A and Ā."
status       = "math.machine-checked"
lean         = "ZenoFront.Feasible.exists_roleConfig_records"
lean_partial = "ZenoFront.recCities, ZenoFront.landingRecs"
paper        = "Lemma 4.3, doc/theory/exact-front.md §4.2"
created      = "2026-11-23"

[claims.lem-4-4]
kind      = "lemma"
statement = "Lemma 4.4 (shrinking role configurations): Let p ≤ s. A role configuration with s + 2N landings has one with exactly s landings whose drop-offs, pick-ups and crossings are sub-multisets of the old ones, so its cost, role loads and groups do not grow."
status    = "math.machine-checked"
lean      = "ZenoFront.RoleConfig.exists_shrink, ZenoFront.RoleConfig.roleLoad_mono, ZenoFront.cost_mono"
paper     = "Lemma 4.4, doc/theory/exact-front.md §4.2"
created   = "2026-11-23"

[claims.lem-4-5]
kind      = "lemma"
statement = "Lemma 4.5 (parity) [PAR]: for a role configuration on Q with passenger count t, the groups X_k = Dr_k + Pk_k + Cr_k form an admissible partition of a multiset of size 2t − |Q|, with the same cost. Lean form: admissibility of the groups, with the witness h_{k,i} = (Dr_k(i) + Pk_k(i)) mod 2 (RoleConfig.isParityWitness_witness); size and cost hold by definition."
status    = "math.machine-checked"
lean      = "ZenoFront.RoleConfig.admissible_groups"
paper     = "Lemma 4.5, doc/theory/exact-front.md §4.2"
created   = "2026-11-23"

[claims.lem-4-6]
kind         = "lemma"
statement    = "Lemma 4.6 (adding a plane): An admissible partition of q planes with 2t − q landings, t ≥ q + 1, gives an admissible partition of q + 1 planes with 2t − q − 1 landings, no larger cost, and loads bounded by every bound on the old loads; repeating, one of p planes for any q ≤ p ≤ t."
status       = "math.machine-checked"
lean         = "ZenoFront.Admissible.addPlane_of_size, ZenoFront.Admissible.addPlanes_le"
lean_partial = "ZenoFront.Admissible.addPlane, ZenoFront.Admissible.addPlanes"
paper        = "Lemma 4.6, doc/theory/exact-front.md §4.2"
created      = "2026-11-23"

[claims.thm-4-7]
kind      = "theorem"
statement = "Theorem 4.7 (converse): under (S) and (A1), every feasible plan with cost C, makespan M and flight times F_k is dominated by an admissible partition X_1..X_p of a multiset X with |X| = s, c(X) ≤ C and ℓ(X_k) ≤ F_k ≤ M. Lean form: (A1) as Network.A1, F_k as durSum (P k)."
