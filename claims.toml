[claims.lem-7-2]
kind      = "lemma"
statement = "Lemma 7.2: the one-plane table satisfies G[m][τ] = min{c(Y) : |Y| = m, δ(Y) ≤ τ} (∞ if there is none), and G is non-increasing in τ. Lean form: the least cost when an m-multiset with δ ≤ τ exists, with oneplane_eq_top_iff for the ∞ case; the monotonicity in τ is not stated."
status    = "math.machine-checked"
lean      = "ZenoFront.isLeast_oneplane"
paper     = "Lemma 7.2, doc/theory/exact-front.md §7.2"
created   = "2026-11-23"

# ===========================================================================
# Claims of the two papers (refuted)
# ===========================================================================

[claims.paper-greedy-optimal]
kind      = "conjecture"
statement = "Claim of EvoCOP 2015 (Algorithm 1) and arXiv:2304.14659 (§3.2): for a fixed multiset of landings (a PPP), the greedy that gives the longest flights first to the least-loaded plane schedules it optimally, so the fronts ZenoSolver computes are the true Pareto fronts."
status    = "math.disproved"
paper     = "EvoCOP 2015 Alg. 1; arXiv:2304.14659 §3.2; doc/theory/exact-front.md §5"
created   = "2026-11-23"

[claims.paper-no-harmful-waiting]
kind      = "conjecture"
statement = "Assumption of arXiv:2304.14659, Conjecture 6.5 of the note: under (AΔ-path), every role configuration has orders and a link matching whose template has makespan max_k λ_k, and in its front-level form the front is the Pareto set of (cost, max_k λ_k) over role configurations."
status    = "math.disproved"
paper     = "arXiv:2304.14659; Conj 6.5, doc/theory/exact-front.md §6.2"
created   = "2026-11-23"

