# claims.toml: the CKC claim registry for ZenoSolver.
#
# One entry per claim of the theory note doc/theory/exact-front.md, plus the two claims of the
# papers it corrects. The slug (table key) is what commit footers reference as `claim:<slug>` or
# `conjecture:<slug>`. `status` is a CACHE of the effective status computed from the commit graph
# (`claimgraph status . --claims claims.toml`); regenerate it, do not treat it as the source of
# truth. The commits are the record: a status changes only by a new commit.
#
# Slugs: `<kind>-<number with dots as dashes>`, with the kind read from the note's own label:
#   def  Definition    lem   Lemma        thm  Theorem       prop  Proposition
#   cor  Corollary     conj  Conjecture   claim  Statement, or a statement located by its section
# so Theorem 4.7 is thm-4-7, Conjecture 4.10 is conj-4-10, Statement 1.2 is claim-1-2, the greedy
# counterexamples of section 5 are claim-5 and the end of section 6.2 is claim-6-2-end. The papers'
# claims are paper-greedy-optimal and paper-no-harmful-waiting. Experiments are exp-<id>, in the
# Experiments section at the end of this file.
#
# Fields:
#   kind          definition, lemma, theorem, proposition, corollary, conjecture or claim
#   statement     one or two sentences. For a kernel-checked claim whose Lean statement is narrower
#                 than the note's, it ends with the "Lean form".
#   status        cache of the effective status (legend below)
#   lean          the Lean declarations whose kernel proof is the claim (math.machine-checked)
#   lean_partial  Lean declarations that prove only part of a claim recorded as a written proof
#   paper         the locus in the note (or in the papers)
#   created       the date the note first stated the claim
#
# Sources: the note doc/theory/exact-front.md; A. Quemy, M. Schoenauer, "True Pareto Fronts for
# Multi-Objective AI Planning Instances", EvoCOP 2015, LNCS 9026 (hal-01109777); A. Quemy,
# M. Schoenauer, J. Dreo, arXiv:2304.14659 (2023). The papers' errors: doc/erratum.md.
#
# Status legend (axis 2, epistemic):
#   math.machine-checked  clean Lean kernel proof (Axioms: only propext, Classical.choice, Quot.sound)
#   math.proved-informal  complete written proof in the note (P), not a complete Lean proof
#   math.conjectured      open (O) or only sketched (S) in the note
#   math.disproved        refuted by a counterexample

# ===========================================================================
# 1. Model
# ===========================================================================

[claims.lem-1-1]
kind      = "lemma"
statement = "Lemma 1.1 (dominating subset): if S' ⊆ S ⊆ K² with S' finite and every point of S weakly dominated by a point of S', then Min S = Min S', and every point of S is weakly dominated by a point of Min S. Lean form: Min S = Min S' in any partial order, without finiteness; the second clause, domination by a point of Min S, is not part of the Lean statement."
status    = "math.machine-checked"
lean      = "ZenoFront.minimal_iff_of_subset_of_dominated"
paper     = "Lemma 1.1, doc/theory/exact-front.md §1.5"
created   = "2026-11-23"

[claims.claim-1-2]
kind      = "claim"
statement = "Statement 1.2 (PDDL correspondence): a plan of the PDDL domain under ε-separation gives an event-ordered plan of §1.2 with the same cost and no larger makespan, and an event-ordered plan of makespan M gives PDDL plans of total-time at most M + Kε, so the PDDL front tends to the front of event-ordered plans as ε → 0."
status    = "math.conjectured"
paper     = "Statement 1.2, doc/theory/exact-front.md §1.3"
created   = "2026-11-23"

# ===========================================================================
# 2. Segments, admissible partitions, link forests
# ===========================================================================

[claims.lem-2-1]
kind      = "lemma"
statement = "Lemma 2.1: on every route from C_I to C_G, the number of segments of type A (C_I to C_G) exceeds the number of type Ā (C_G to C_I) by one. Lean form: counts the landing records of a feasible plane by the hub they are entered from and left towards (#A = #Ā + 1), the reading of Step 1 of Theorem 4.7 in which a central leg passes through C_G; VChain.countP_isA is the same count on visits."
status    = "math.machine-checked"
lean      = "ZenoFront.PlaneFeasible.cntA_eq"
paper     = "Lemma 2.1, doc/theory/exact-front.md §2"
created   = "2026-11-23"

[claims.def-2-2]
kind      = "definition"
statement = "Definition 2.2 (admissible partition): a partition X_1..X_p is admissible if it has a parity matrix h ∈ {0,1}^{p×n} with h_{k,i} = 1 only where X_k(i) ≥ 1, every row sum ≡ |X_k| + 1 and every column sum even (mod 2). Lean form: Admissible X := ∃ h, IsParityWitness X h, with h k a set of cities of X_k (the ones of row k)."
status    = "math.machine-checked"
lean      = "ZenoFront.Admissible"
paper     = "Def 2.2, doc/theory/exact-front.md §2"
created   = "2026-11-23"

[claims.lem-2-3]
kind      = "lemma"
statement = "Lemma 2.3 (integer form) [A′]: a partition is admissible iff some h̃ ∈ ℕ^{p×n} has h̃_{k,i} ≤ X_k(i), Σ_i h̃_{k,i} ≡ |X_k| + 1 for every plane k and Σ_k h̃_{k,i} ≡ 0 for every city i (mod 2)."
status    = "math.proved-informal"
paper     = "Lemma 2.3, doc/theory/exact-front.md §2"
created   = "2026-11-23"

[claims.lem-2-4]
kind      = "lemma"
statement = "Lemma 2.4 (component form): (a) a partition is admissible iff every connected component of the plane-city graph H (k joined to i when X_k(i) ≥ 1) has an even number of even planes; (b) then every spanning forest of H contains the support of some parity matrix."
status    = "math.proved-informal"
paper     = "Lemma 2.4, doc/theory/exact-front.md §2"
created   = "2026-11-23"

[claims.lem-2-5]
kind      = "lemma"
statement = "Lemma 2.5: for every parity matrix and every plane k, h_k ≤ |X_k| − 1."
status    = "math.machine-checked"
lean      = "ZenoFront.IsParityWitness.card_add_one_le"
paper     = "Lemma 2.5, doc/theory/exact-front.md §2"
created   = "2026-11-23"

[claims.lem-2-6]
kind      = "lemma"
statement = "Lemma 2.6 (link forest) [LF]: a partition is admissible iff it has a link forest, and an admissible partition has one with at most one edge of each label at each plane. Lean form: link forests are lists of rooted link trees satisfying (F2), whose groups equal the X_k as a multiset; the second clause (at most one edge of each label at each plane) is not formalised."
status    = "math.machine-checked"
lean      = "ZenoFront.admissible_iff_exists_linkForest"
paper     = "Lemma 2.6, doc/theory/exact-front.md §2"
created   = "2026-11-23"

[claims.cor-2-7]
kind      = "corollary"
statement = "Corollary 2.7: if |X| = s, every link forest has at most t − p edges, and each of its trees has at most q_max = min(p, t − p + 1) planes."
status    = "math.proved-informal"
paper     = "Cor 2.7, doc/theory/exact-front.md §2"
created   = "2026-11-23"

[claims.lem-2-8]
kind      = "lemma"
statement = "Lemma 2.8 (few touched cities) [B′]: for an admissible partition with |X| = s, (a) every parity matrix touches at most t − p cities, (b) one with the fewest entries 1 has an acyclic support and touches at most p − 1 cities, and (c) so some parity matrix touches at most min(p − 1, t − p) cities. Lean form: (c), (a) and the bound of (b) are the three declarations; the acyclic support of (b) appears as the linear independence of the edge vectors over ZMod 2 (IsParityWitness.exists_edgeCount_lt)."
status    = "math.machine-checked"
lean      = "ZenoFront.Admissible.exists_card_touched_le, ZenoFront.IsParityWitness.card_touched_le, ZenoFront.IsParityWitness.card_touched_le_of_minimal"
paper     = "Lemma 2.8, doc/theory/exact-front.md §2"
created   = "2026-11-23"

[claims.lem-2-9]
kind      = "lemma"
statement = "Lemma 2.9 (shared city): non-empty groups with Σ_k |X_k| ≡ p (mod 2) form an admissible partition if some city belongs to every even group, in particular if all groups share a city or all even groups are equal."
status    = "math.proved-informal"
paper     = "Lemma 2.9, doc/theory/exact-front.md §2"
created   = "2026-11-23"

# ===========================================================================
# 3. Lemmas valid in every setting
# ===========================================================================

[claims.lem-3-1]
kind         = "lemma"
statement    = "Lemma 3.1 (cleaning): every plan can be changed, keeping all routes (so cost, makespan and flight times), so that every journey is clean: its first flight is its only departure from C_I and its last flight its only arrival in C_G."
status       = "math.proved-informal"
lean_partial = "ZenoFront.exists_transfer"
paper        = "Lemma 3.1, doc/theory/exact-front.md §3"
created      = "2026-11-23"

[claims.lem-3-2]
kind      = "lemma"
statement = "Lemma 3.2 (counting): a feasible plan has at least s = 2t − p segments, hence at least s landings in central cities. Lean form: 2t ≤ Σ_k (hub arrivals of plane k) + p, by counting legs, for any central flights; segments are counted as hub arrivals, and the consequence on landings is not stated separately."
status    = "math.machine-checked"
lean      = "ZenoFront.Feasible.le_sum_hubArrivals"
paper     = "Lemma 3.2, doc/theory/exact-front.md §3"
created   = "2026-11-23"

[claims.lem-3-3]
kind         = "lemma"
statement    = "Lemma 3.3 (segment durations): a segment visiting x_1..x_m lasts (a) at least d_{x_1} + d_{x_m} under (S); (b) under (AΔ), at least d_{x_j} + d̄_{x_j} for types A and Ā, 2d_{x_j} for B and 2d̄_{x_j} for B̄; and (c) exactly d_x + d̄_x, 2d_x or 2d̄_x if it is simple."
status       = "math.proved-informal"
lean_partial = "ZenoFront.PlaneFeasible.exists_segments, ZenoFront.roleW_landingRecs_le"
paper        = "Lemma 3.3, doc/theory/exact-front.md §3"
created      = "2026-11-23"

[claims.lem-3-4]
kind      = "lemma"
statement = "Lemma 3.4 (relaxation) [R]: under (S), every feasible plan with cost C and makespan M has non-empty multisets Y_1..Y_p with Σ_k |Y_k| = s, c(Y) ≤ C and ℓ(Y_k) ≤ F_k ≤ M, hence C ≥ L(⌊M/2⌋) with integer durations; no assumption on central flights is needed. Lean form: integer data, (S) as d̄ = d, an explicit p ≤ t, and 2δ(Y_k) ≤ M in place of ℓ(Y_k) ≤ F_k; relaxCost_oneplane_le_totalCost is the bound by L."
status    = "math.machine-checked"
lean      = "ZenoFront.Feasible.exists_relaxation, ZenoFront.relaxCost_oneplane_le_totalCost"
paper     = "Lemma 3.4, doc/theory/exact-front.md §3"
created   = "2026-11-23"

# ===========================================================================
# 4. Symmetric case
# ===========================================================================

[claims.thm-4-1]
kind      = "theorem"
statement = "Theorem 4.1 (achievability): under (S), every admissible partition X_1..X_p of a multiset X with |X| = s is flown by a feasible plan whose central landings are exactly X (cost c(X)) and whose makespan is max_k ℓ(X_k), using no central flight. Lean form: an explicit p ≤ t; the landings equal X up to relabelling the planes; that plane k flies for ℓ(X_k) and picks up at most one passenger holds for the construction (LTree.routes) but is not in the statement."
status    = "math.machine-checked"
lean      = "ZenoFront.Admissible.exists_plan"
paper     = "Thm 4.1, doc/theory/exact-front.md §4.1"
created   = "2026-11-23"

[claims.def-4-2]
kind      = "definition"
statement = "Definition 4.2 (role configuration): drop-offs Dr_k, pick-ups Pk_k and crossings Cr_k per plane, multisets of central cities with |Cr_k| odd and Σ_k Dr_k = Σ_k Pk_k city by city, with its passenger count, cost and role loads λ_k. Lean form: RoleConfig holds the three families, the parity and the balance; the groups and the role loads are separate definitions (RoleConfig.groups, RoleConfig.roleLoad), and the passenger count t appears as 2t − p landings."
status    = "math.machine-checked"
lean      = "ZenoFront.RoleConfig"
paper     = "Def 4.2, doc/theory/exact-front.md §4.2"
created   = "2026-11-23"

[claims.lem-4-3]
kind         = "lemma"
statement    = "Lemma 4.3 (direct selection) [DS]: (a) in a simple plan with clean journeys every journey is C_I → x → C_G; (b) such a plan on planes Q, routes ending in C_G, gives a role configuration on Q with passenger count at least t, cost at most the plan's, λ_k ≤ F_k and groups inside the planes' landings."
status       = "math.proved-informal"
lean_partial = "ZenoFront.Feasible.exists_roleConfig_records"
paper        = "Lemma 4.3, doc/theory/exact-front.md §4.2"
created      = "2026-11-23"

[claims.lem-4-4]
kind      = "lemma"
statement = "Lemma 4.4 (shrinking) [SH]: a role configuration on Q with t(cfg) > t ≥ |Q| shrinks, by deleting landings, to one with passenger count exactly t whose cost, role loads and groups are no larger. Lean form: stated by landing count (s + 2N landings down to s ≥ p) with every role multiset shrinking, so cost, role loads and groups do not grow; Admissible.exists_shrink is the partition form used by Theorem 4.7."
status    = "math.machine-checked"
lean      = "ZenoFront.RoleConfig.exists_shrink, ZenoFront.Admissible.exists_shrink"
paper     = "Lemma 4.4, doc/theory/exact-front.md §4.2"
created   = "2026-11-23"

[claims.lem-4-5]
kind      = "lemma"
statement = "Lemma 4.5 (parity) [PAR]: for a role configuration on Q with passenger count t, the groups X_k = Dr_k + Pk_k + Cr_k form an admissible partition of a multiset of size 2t − |Q|, with the same cost. Lean form: admissibility of the groups, with the witness h_{k,i} = (Dr_k(i) + Pk_k(i)) mod 2 (RoleConfig.isParityWitness_witness); size and cost hold by definition."
status    = "math.machine-checked"
lean      = "ZenoFront.RoleConfig.admissible_groups"
paper     = "Lemma 4.5, doc/theory/exact-front.md §4.2"
created   = "2026-11-23"

[claims.lem-4-6]
kind      = "lemma"
statement = "Lemma 4.6 (adding a plane) [AP]: an admissible partition of q planes with 2t − q landings and t ≥ q + 1 gives an admissible partition of q + 1 planes with 2t − q − 1 landings, no larger cost and no larger max_k δ(Y_k)."
status    = "math.machine-checked"
lean      = "ZenoFront.Admissible.addPlane_of_size"
paper     = "Lemma 4.6, doc/theory/exact-front.md §4.2"
created   = "2026-11-23"

[claims.thm-4-7]
kind      = "theorem"
statement = "Theorem 4.7 (converse): under (S) and (A1), every feasible plan with cost C, makespan M and flight times F_k is dominated by an admissible partition X_1..X_p of a multiset X with |X| = s, c(X) ≤ C and ℓ(X_k) ≤ F_k ≤ M. Lean form: integer data, (S) as d̄ = d, (A1) as Network.A1, an explicit p ≤ t, and 2δ(X_k) ≤ M in place of ℓ(X_k) ≤ F_k."
status    = "math.machine-checked"
lean      = "ZenoFront.Feasible.exists_admissible"
paper     = "Thm 4.7, doc/theory/exact-front.md §4.3"
created   = "2026-11-23"

[claims.cor-4-8]
kind      = "corollary"
statement = "Corollary 4.8: under (S) and (A1), the front is Min {(c(X), M(X)) : |X| = s, M(X) < ∞}, with M(X) the least max_k ℓ(X_k) over admissible partitions of X, and every front point is attained by a plan with exactly s central landings. Lean form: the minimal points of the plans equal those of the multiset points (multisetPoints), with an explicit p ≤ t; the attainment is Theorem 4.1 and is not restated."
status    = "math.machine-checked"
lean      = "ZenoFront.minimal_achievable_iff_multisetPoints"
paper     = "Cor 4.8, doc/theory/exact-front.md §4.4"
created   = "2026-11-23"

[claims.thm-4-9]
kind      = "theorem"
statement = "Theorem 4.9 (bridge) [B3]: under (S) and (A1), the front of the variant in which planes may end anywhere and the makespan is the last arrival equals the front F. Lean form: an explicit p ≤ t."
status    = "math.machine-checked"
lean      = "ZenoFront.minimal_achievable_iff_anywhere_of_A1"
paper     = "Thm 4.9, doc/theory/exact-front.md §4.5"
created   = "2026-11-23"

[claims.conj-4-10]
kind      = "conjecture"
statement = "Conjecture 4.10: Theorem 4.7 holds under (S) and (AΔ), without (A1); equivalently, every feasible plan is weakly dominated in (cost, makespan) by a simple feasible plan."
status    = "math.conjectured"
paper     = "Conj 4.10, doc/theory/exact-front.md §4.6"
created   = "2026-11-23"

# ===========================================================================
# 5. The per-PPP greedy of both papers is not exact
# ===========================================================================

[claims.claim-5]
kind         = "claim"
statement    = "Section 5 (greedy counterexamples): the per-PPP greedy of both papers, longest flights first to the least-loaded plane, misses front points: for d = (6, 10), c = (40, 20), t = 5, p = 2 it flies the landings of the front point (260, 60) in makespan 68, and for d = (1, 3), c = (9, 5), t = 4, p = 2 it misses (42, 12)."
status       = "math.proved-informal"
lean_partial = "ZenoFront.Examples.lptCounterexample_front"
paper        = "§5, doc/theory/exact-front.md"
created      = "2026-11-23"

