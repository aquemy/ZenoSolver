[claims.prop-8-2]
kind      = "proposition"
statement = "Proposition 8.2 (fixed p): for p = 2 deciding M(X) ≤ 2T stays NP-complete, even with positive durations, and for every fixed p it is solvable in time polynomial in n, s and T, so it is weakly NP-complete."
status    = "math.proved-informal"
paper     = "Prop 8.2, doc/theory/exact-front.md §8"
created   = "2026-11-23"

[claims.cor-8-3]
kind      = "corollary"
statement = "Corollary 8.3: E(T), and under (S) and (A1) the front, are computable in pseudo-polynomial time, so computing the front is not strongly NP-hard unless P = NP."
status    = "math.proved-informal"
paper     = "Cor 8.3, doc/theory/exact-front.md §8"
created   = "2026-11-23"

