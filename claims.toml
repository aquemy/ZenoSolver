kind      = "definition"
statement = "Definition 5.2 (scheduled configuration, template value): A scheduled configuration S gives every plane k an ordered list Dr_k of drop-offs, an ordered list Pk_k of pick-ups and a multiset Cr_k of crossings, and maps every pick-up slot (v, l) to a drop-off slot mate(v, l) = (u, j). It is valid if every |Cr_k| is odd, the drop-off of mate(v, l) is at the city of Pk_v[l], mate is injective, and there are as many drop-offs as pick-ups in all. Its size, cost and role loads are those of Definition 5.1, read on the lists. Its template value is M_tmpl(S) = max(max_k λ_k, max over the links (u, j; v, l) at x of Pre_u(j) + d_x + d̄_x + Suf_v(l)), with Pre_u(j) = 2Σ_{j′<j} d(Dr_u[j′]) and Suf_v(l) = 2Σ_{l′>l} d̄(Pk_v[l′]). S schedules a role configuration if its lists and multisets are that configuration's drop-offs, pick-ups and crossings."
