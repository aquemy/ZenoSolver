# claims.toml: the CKC claim registry for ZenoSolver.
#
# One entry per claim of the theory note doc/theory/exact-front.md, plus the claims of the
# papers it corrects. The slug (table key) is what commit footers reference as `claim:<slug>` or
# `conjecture:<slug>`. `status` is a CACHE of the effective status computed from the commit graph
# (`claimgraph status . --claims claims.toml`); regenerate it, do not treat it as the source of
# truth. The commits are the record: a status changes only by a new commit.
#
# Slugs: `<kind>-<number with dots as dashes>`, with the kind read from the note's own label:
#   def  Definition    lem   Lemma        thm  Theorem       prop  Proposition
#   cor  Corollary     conj  Conjecture   claim  Statement, or a statement located by its section
# so Theorem 4.7 is thm-4-7, Conjecture 4.10 is conj-4-10, Statement 1.2 is claim-1-2, the greedy
# counterexamples of section 5 are claim-5 and the end of section 6.2 is claim-6-2-end. The papers'
# claims are paper-greedy-optimal, paper-no-harmful-waiting and
# paper-general-graph-reduction. A statement the note does not
# number gets a descriptive slug: claim-converse-s-only, the converse under (S) alone. Experiments
# are exp-<id>, in the Experiments section at the end of this file.
#
# Fields:
#   kind          definition, lemma, theorem, proposition, corollary, conjecture or claim
#   statement     one or two sentences. For a kernel-checked claim it may end with the "Lean form":
#                 how the Lean statement encodes the note's (natural-number data, (S) as d̄ = d, ...).
#   status        cache of the effective status (legend below)
#   lean          the Lean declarations whose kernel proof is the claim (math.machine-checked)
#   lean_partial  Lean declarations that prove only part of a claim recorded as a written proof
#   paper         the locus in the note (or in the papers)
#   created       the date the note first stated the claim
#
# Sources: the note doc/theory/exact-front.md; A. Quemy, M. Schoenauer, "True Pareto Fronts for
# Multi-Objective AI Planning Instances", EvoCOP 2015, LNCS 9026 (hal-01109777); A. Quemy,
# M. Schoenauer, J. Dreo, arXiv:2304.14659 (2023). The papers' errors: doc/erratum.md.
#
# Status legend (axis 2, epistemic):
#   math.machine-checked  clean Lean kernel proof (Axioms: only propext, Classical.choice, Quot.sound)
#                         of every assertion of the statement, up to the Lean model's encoding
#   math.proved-informal  complete written proof in the note (P); Lean may prove part (lean_partial)
#   math.conjectured      open (O) or only sketched (S) in the note
#   math.disproved        refuted by a counterexample

# ===========================================================================
# 1. Model
# ===========================================================================

[claims.lem-1-1]
kind      = "lemma"
statement = "Lemma 1.1 (dominating sets): (a) If every point of A is weakly dominated by a point of B and every point of B by a point of A, then Min A = Min B; in particular when B ⊆ A and B dominates A. (b) A list that is the Pareto front of S lists exactly Min S."
status    = "math.machine-checked"
lean      = "ZenoFront.minimal_iff_of_dominated, ZenoFront.minimal_iff_of_subset_of_dominated, ZenoFront.IsParetoFront.mem_iff_minimal"
paper     = "Lemma 1.1, doc/theory/exact-front.md §1.5"
created   = "2026-11-23"

[claims.claim-1-2]
kind      = "claim"
statement = "Statement 1.2 (PDDL correspondence): a plan of the PDDL domain under ε-separation gives an event-ordered plan of §1.2 with the same cost and no larger makespan, and an event-ordered plan of makespan M gives PDDL plans of total-time at most M + Kε, so the PDDL front tends to the front of event-ordered plans as ε → 0."
status    = "math.conjectured"
paper     = "Statement 1.2, doc/theory/exact-front.md §1.3"
created   = "2026-11-23"

[claims.lem-rounding]
kind      = "lemma"
statement = "Lemma (rounding times), new in revision 3: Let a plan have times in ℚ or ℝ, integer durations, and satisfy Definition 1.2. Rounding every time down gives a feasible plan with natural-number times, the same cost and a makespan at most the original one; conversely an integer plan is such a plan with the same cost and makespan."
status    = "math.machine-checked"
lean      = "ZenoFront.QFeasible.floor, ZenoFront.qPlanCost_eq, ZenoFront.planMakespan_floor_le, ZenoFront.Feasible.toRat"
paper     = "revision 3 (planned)"
created   = "2026-11-25"

[claims.def-instance]
kind      = "definition"
statement = "Definition (instance), new in revision 3: Central cities 1, …, n and hubs C_I, C_G; durations d_i (C_I–i) and d̄_i (i–C_G) in ℕ and a central duration dc(i, j) ∈ ℕ for every ordered pair of central cities, i = j included; no flight joins the two hubs. Landing in i costs c_i ∈ ℕ, hubs are free; p planes and t passengers start in C_I. Theorems assume 1 ≤ p ≤ t where they use it."
status    = "math.machine-checked"
lean      = "ZenoFront.Network, ZenoFront.Network.duration"
paper     = "revision 3 (planned)"
created   = "2026-11-25"

[claims.def-plan]
kind      = "definition"
statement = "Definition (plan), new in revision 3: A plan gives each plane a list of legs (origin, destination, departure, arrival, passenger or none). It is feasible if every leg is a flight of exactly its duration, each plane's legs form a route from C_I (each leg leaves where the previous one arrived, no earlier, the first at time ≥ 0) ending in C_G, and for each passenger the legs naming it form, in some order, such a route from time 0 ending in C_G. Cost: the landing costs of all legs into central cities; makespan: the latest end of a route; in the variant with planes ending anywhere, routes need not end in C_G."
status    = "math.machine-checked"
lean      = "ZenoFront.Leg, ZenoFront.Plan, ZenoFront.Flies, ZenoFront.IsRoute, ZenoFront.PlaneFeasible, ZenoFront.Feasible, ZenoFront.planCost, ZenoFront.planMakespan, ZenoFront.PlaneFeasibleAnywhere, ZenoFront.FeasibleAnywhere"
paper     = "revision 3 (planned)"
created   = "2026-11-25"

[claims.def-assumptions]
kind      = "definition"
statement = "Definition (assumptions), new in revision 3: (S) d̄ = d. (A1) d_i + d_j ≤ dc(i, j). (A1-NS) min(d_i + d_j, d̄_i + d̄_j) ≤ dc(i, j). (AΔ) dur(a, b) ≤ dur(a, x) + dur(x, b) whenever a ≠ b and the three flights exist. (H) d_j ≤ d_i + dc(i, j) and d_i ≤ dc(i, j) + d_j for all central i, j (the triangles through C_I, and under (S) through C_G)."
status    = "math.machine-checked"
lean      = "ZenoFront.Network.A1, ZenoFront.Network.A1NS, ZenoFront.Network.ATri, ZenoFront.Network.ATriHub"
paper     = "revision 3 (planned)"
created   = "2026-11-25"

[claims.lem-hub-triangles]
kind      = "lemma"
statement = "Lemma (hub triangles), new in revision 3: (A1) implies (H), and (AΔ) implies (H)."
status    = "math.machine-checked"
lean      = "ZenoFront.Network.A1.hub, ZenoFront.Network.ATri.hub"
paper     = "revision 3 (planned)"
created   = "2026-11-25"

[claims.def-front]
kind      = "definition"
statement = "Definition (fronts), new in revision 3: Points (cost, makespan) are ordered componentwise, and y weakly dominates z when y ≤ z. Min S is the set of minimal points of S; the front is F = Min A, A (A′) the points of the feasible plans (of the plans whose planes end anywhere). A list is the Pareto front of S if its points lie in S, weakly dominate every point of S and are pairwise incomparable."
status    = "math.machine-checked"
lean      = "ZenoFront.achievable, ZenoFront.achievableAnywhere, ZenoFront.IsParetoFront"
paper     = "revision 3 (planned)"
created   = "2026-11-25"

# ===========================================================================
# 2. Segments, admissible partitions, link forests
# ===========================================================================

[claims.lem-2-1]
kind      = "lemma"
statement = "Lemma 2.1 (crossings outnumber returns): Record every central landing of a route with whether its incoming leg leaves C_I and whether its outgoing leg arrives in C_I (a central outgoing leg counts as towards C_G). On a route from C_I to C_G, the records of type A (from C_I, not back to C_I) number one more than those of type Ā (not from C_I, back to C_I). On a route without central flights the records are its segments."
status    = "math.machine-checked"
lean      = "ZenoFront.landingRecs, ZenoFront.cntA, ZenoFront.cntAbar, ZenoFront.PlaneFeasible.cntA_eq, ZenoFront.TRoute.countP_isA"
paper     = "Lemma 2.1, doc/theory/exact-front.md §2"
created   = "2026-11-23"

[claims.def-2-2]
kind      = "definition"
statement = "Definition 2.2 (admissible partitions): A partition of a multiset X over p planes is a family of groups X_1, …, X_p with Σ_k X_k = X. A parity matrix gives each plane k a set η_k of cities of X_k with |η_k| ≡ |X_k| + 1 (mod 2), every city lying in an even number of the η_k. The partition is admissible if it has a parity matrix."
status    = "math.machine-checked"
lean      = "ZenoFront.IsParityWitness, ZenoFront.Admissible"
paper     = "Def 2.2, doc/theory/exact-front.md §2"
created   = "2026-11-23"

[claims.lem-2-3]
kind      = "lemma"
statement = "Lemma 2.3 (integer form): A partition is admissible iff some h̃ ∈ ℕ^{p×n} has h̃_{k,i} ≤ X_k(i), Σ_i h̃_{k,i} ≡ |X_k| + 1 (mod 2) for every plane k, and Σ_k h̃_{k,i} even for every city i."
status    = "math.machine-checked"
lean      = "ZenoFront.admissible_iff_exists_natWitness"
paper     = "Lemma 2.3, doc/theory/exact-front.md §2"
created   = "2026-11-23"

[claims.lem-2-4]
kind      = "lemma"
statement = "Lemma 2.4 (component form): (a) a partition is admissible iff every connected component of the plane-city graph H (k joined to i when X_k(i) ≥ 1) has an even number of even planes; (b) then every spanning forest of H contains the support of some parity matrix."
status    = "math.proved-informal"
paper     = "Lemma 2.4, doc/theory/exact-front.md §2"
created   = "2026-11-23"

[claims.lem-2-5]
kind      = "lemma"
statement = "Lemma 2.5 (the row bound): For every parity matrix and plane k, |η_k| + 1 ≤ |X_k|. Hence the groups of an admissible partition are non-empty, and |X| ≡ p (mod 2)."
status    = "math.machine-checked"
lean      = "ZenoFront.IsParityWitness.card_add_one_le, ZenoFront.Admissible.card_pos, ZenoFront.IsParityWitness.size_mod_two"
paper     = "Lemma 2.5, doc/theory/exact-front.md §2"
created   = "2026-11-23"

[claims.lem-2-6]
kind         = "lemma"
statement    = "Lemma 2.6 (link forests): A partition is admissible iff it has a link forest."
status       = "math.machine-checked"
lean         = "ZenoFront.admissible_iff_exists_linkForest"
lean_partial = "ZenoFront.Admissible.exists_linkForest, ZenoFront.admissible_forestPartition"
paper        = "Lemma 2.6, doc/theory/exact-front.md §2"
created      = "2026-11-23"

[claims.cor-2-7]
kind      = "corollary"
statement = "Corollary 2.7: if |X| = s, every link forest has at most t − p edges, and each of its trees has at most q_max = min(p, t − p + 1) planes."
status    = "math.proved-informal"
paper     = "Cor 2.7, doc/theory/exact-front.md §2"
created   = "2026-11-23"

[claims.lem-2-8]
kind         = "lemma"
statement    = "Lemma 2.8 (few touched cities): An admissible partition with |X| = s has a parity matrix whose sets η_k together contain at most min(p − 1, t − p) cities."
status       = "math.machine-checked"
lean         = "ZenoFront.Admissible.exists_card_touched_le"
lean_partial = "ZenoFront.IsParityWitness.card_touched_le_of_minimal, ZenoFront.IsParityWitness.card_touched_le"
paper        = "Lemma 2.8, doc/theory/exact-front.md §2"
created      = "2026-11-23"

[claims.lem-2-9]
kind      = "lemma"
statement = "Lemma 2.9 (shared city): non-empty groups with Σ_k |X_k| ≡ p (mod 2) form an admissible partition if some city belongs to every even group, in particular if all groups share a city or all even groups are equal."
status    = "math.proved-informal"
paper     = "Lemma 2.9, doc/theory/exact-front.md §2"
created   = "2026-11-23"

[claims.def-link-forest]
kind      = "definition"
statement = "Definition (link forest), new in revision 3: A rooted link tree is a plane with a multiset of free landings and a list of children, each hung from it by a link labelled with a city; the group of a plane is its free landings, one copy of each child's label and one copy of its parent's label, so (F1) holds by construction. (F2): every plane has an odd number of free landings. A link forest of a partition is a list of such trees satisfying (F2) whose groups are the partition's groups, up to relabelling the planes."
status    = "math.machine-checked"
lean      = "ZenoFront.LTree, ZenoFront.LKids, ZenoFront.LTree.groups, ZenoFront.LTree.WF, ZenoFront.forestGroups"
paper     = "revision 3 (planned)"
created   = "2026-11-25"

