  <text x="305.0" y="522.0" text-anchor="middle" class="mono s17">free</text>
  <path d="M 250.00 298.00 L 249.30 329.33 L 251.15 360.67 L 250.00 392.00" fill="none" stroke="#111111" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
