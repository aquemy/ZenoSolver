<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 770" width="1200" height="770">
  <defs>
    <style type="text/css"><![CDATA[
      /* THEME: clean - deterministic system monospace. NO network @import.
         Never add an @import here (and never write &amp; inside CDATA - the literal
         &amp; breaks the URL, the font silently fails, and the render becomes
         non-deterministic). For the retro VT323 look, copy assets/scaffold-retro.svg
         instead - it embeds the font as base64 (also zero-network). adv ≈ 0.60em. */
      text          { fill: #111111; font-family: 'SF Mono', Menlo, Monaco, Consolas, 'Courier New', monospace; }
      .mono         { font-family: 'SF Mono', Menlo, Monaco, Consolas, 'Courier New', monospace; }
      .title        { font-size: 40px; font-weight: 500; }
      .section-label{ font-size: 17px; letter-spacing: 4px; fill: #6b7280; }   /* INPUTS / OUTPUTS / zone tags */
      .layer-tag    { font-size: 17px; letter-spacing: 4px; fill: #6b7280; }   /* tag above a band / layer / boundary */
      .layer-label  { font-size: 17px; letter-spacing: 4px; fill: #6b7280; }
      .zone-label   { font-size: 17px; letter-spacing: 4px; fill: #6b7280; }   /* under a zone-band cell */
      .box-h        { font-size: 28px; }                                       /* box heading */
      .box-s        { font-size: 17px; fill: #6b7280; }                        /* box subtext, gray */
      .box-v        { font-size: 18px; fill: #475569; }                        /* box value, slate */
      .center-h     { font-size: 32px; fill: #ffffff; }                        /* heading on a genuinely DARK fill */
      .center-s     { font-size: 18px; fill: #ffffff; }                        /* subtext on a dark fill */
      .arrow-label  { font-size: 20px; fill: #6b7280; font-style: italic; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }  /* verb on a connector; white halo */
      .caption      { font-size: 22px; fill: #111111; }                        /* one-line takeaway, bottom-center */
      .id-big       { font-size: 76px; letter-spacing: 4px; }                  /* hero identifier (anatomy) */
      .id-uuid      { font-size: 32px; letter-spacing: 1px; fill: #475569; }
      .segment-label{ font-size: 20px; letter-spacing: 2px; }                  /* anatomy segment label */
      .range        { font-size: 38px; }                                       /* big number in a zone band */
      .signal-code  { font-size: 28px; }                                       /* legend code */
      .signal-name  { font-size: 18px; fill: #475569; }                        /* legend name / gloss */
    
      .h24 { font-size: 24px; }
      .h22 { font-size: 22px; }
      .s19 { font-size: 19px; fill: #475569; }
      .s18 { font-size: 18px; fill: #6b7280; }
      .s17 { font-size: 17px; fill: #6b7280; }
      .tok { font-size: 24px; }
      .cell { font-size: 22px; }
      .tag  { font-size: 16px; letter-spacing: 3px; fill: #6b7280; }
    ]]></style>

    <!-- Watercolor wash - feTurbulence + feDisplacementMap + blur. Put on COLORED FILL rects / shapes. -->
    <filter id="wash-a" x="-20%" y="-25%" width="140%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.013" numOctaves="3" seed="2"/>
      <feDisplacementMap in="SourceGraphic" scale="16"/>
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <filter id="wash-b" x="-20%" y="-25%" width="140%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="3" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="14"/>
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
    <filter id="wash-c" x="-20%" y="-25%" width="140%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="3" seed="14"/>
      <feDisplacementMap in="SourceGraphic" scale="18"/>
      <feGaussianBlur stdDeviation="2"/>
    </filter>

    <!-- Ink wobble - turbulence + small displacement, NO blur. Put on STROKES of 2-D shapes. -->
    <filter id="ink-a" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="3"/>
    </filter>
    <filter id="ink-b" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="2.8"/>
    </filter>
    <filter id="ink-c" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="21"/>
      <feDisplacementMap in="SourceGraphic" scale="2.5"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1200" height="770" fill="#ffffff"/>
  <text x="600.0" y="50" text-anchor="middle" class="title">From link tree to plan</text>
  <path d="M 316 68 Q 458 65 600 68 Q 742 71 884 67" fill="none" stroke="#111111" stroke-width="2.4" stroke-linecap="round" filter="url(#ink-a)"/>
